<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-LEAP · Student sign in</title><style>
:root{--g:#11523e;--bg:#f3f8f4;--muted:#577167}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#163d32;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border:1px solid #d8e7dc;border-radius:20px;padding:28px;width:min(440px,100%);box-shadow:0 15px 50px #12402e15}
.brand{font-weight:900;color:var(--g)}h1{margin:10px 0}p{color:var(--muted);line-height:1.45}label{display:grid;gap:7px;margin-top:18px;font-weight:750}
input{font:inherit;min-height:48px;border:1px solid #cadbd0;border-radius:10px;padding:10px 12px}
button{border:0;border-radius:10px;background:var(--g);color:white;font:inherit;font-weight:850;width:100%;padding:13px;margin-top:22px;cursor:pointer}
.status{min-height:24px;margin-top:12px;color:#ae3939;font-weight:700}a{color:var(--g)}
</style></head><body><main class="card">
<div class="brand">E-LEAP</div><h1>Student sign in</h1>
<p>Use your Student ID and 6-digit PIN. You must already have joined your class or been given a Student account.</p>
<form id="studentForm">
<label for="studentId">Student ID<input id="studentId" required maxlength="64" autocomplete="username"></label>
<label for="pin">6-digit PIN<input id="pin" required minlength="6" maxlength="6" pattern="[0-9]{6}" type="password" inputmode="numeric" autocomplete="current-password"></label>
<button type="submit">Sign in</button><div id="status" class="status" role="status" aria-live="polite"></div>
</form><p>Not enrolled? <a href="/student-access.html">Join a class using your class code</a>.</p>
</main><script type="module">
const form=document.getElementById('studentForm'),message=document.getElementById('status');
const rawNext=new URLSearchParams(location.search).get('next')||'/index.html';
const next=(rawNext.startsWith('/')&&!rawNext.startsWith('//')&&!rawNext.includes('\\'))?rawNext:'/index.html';
try{
 const r=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});
 const d=await r.json().catch(()=>({}));
 if(r.ok&&d.user?.role==='student'){localStorage.setItem('e-leap-preview-role','student');location.replace(next);}
}catch{}
form.addEventListener('submit',async event=>{
 event.preventDefault();message.textContent='Signing in…';
 try{
  const response=await fetch('/api/auth/student',{method:'POST',credentials:'same-origin',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({studentId:document.getElementById('studentId').value,pin:document.getElementById('pin').value})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok||data.user?.role!=='student')throw Error(data.error||'Student sign in failed');
  localStorage.setItem('e-leap-preview-role','student');
  location.replace(next);
 }catch(e){message.textContent=e.message||'Unable to sign in';}
});
</script></body></html>
