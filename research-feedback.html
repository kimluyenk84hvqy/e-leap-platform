<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP Research Feedback</title><link rel="stylesheet" href="assets/css/styles.css"><style>
body{margin:0;background:#f4f7f5;font-family:Poppins,system-ui,sans-serif;color:#173f38}.wrap{max-width:760px;margin:0 auto;padding:28px}.card{background:#fff;border:1px solid #e0ebe6;border-radius:18px;padding:22px;margin-bottom:16px}.muted{color:#60756e}.q{padding:12px 0;border-bottom:1px solid #edf2ef}.scale{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.scale label{display:flex;align-items:center;gap:5px;border:1px solid #d9e6e0;border-radius:999px;padding:6px 9px}.btn{min-height:42px;border:1px solid #cfe0d8;border-radius:10px;background:#fff;color:#1d5b4c;font-weight:800;padding:0 14px}.primary{background:#1d5b4c;color:#fff}.actions{display:flex;gap:8px;justify-content:flex-end}.field{display:grid;gap:6px}.field textarea{min-height:90px;border:1px solid #cfe0d8;border-radius:10px;padding:10px}.notice{padding:12px;border-radius:10px;background:#edf5f1;margin-top:12px}</style></head><body><main class="wrap"><div class="card"><div class="muted">E-LEAP Research Feedback</div><h1 id="title">Learning feedback</h1><p class="muted" id="intro">Your responses help evaluate the digital lesson and platform.</p></div><form id="form"><div id="questions" class="card"></div><div class="card"><label class="field">Additional comments<textarea id="comment" placeholder="Optional"></textarea></label><label style="display:flex;gap:8px;align-items:flex-start;margin-top:14px"><input id="consent" type="checkbox"> <span>I agree that my de-identified feedback may be used for research and evaluation.</span></label><div id="msg"></div></div><div class="actions"><a class="btn" href="index.html" style="text-decoration:none;display:inline-flex;align-items:center">Back</a><button class="btn primary" type="submit">Submit feedback</button></div></form></main><script>
const q=new URLSearchParams(location.search),classId=q.get('classId'),sessionId=q.get('sessionId')||null,lessonId=q.get('lessonId')||null;let role='student',dimension='usability';
const studentItems=[['easy_navigation','The lesson/platform was easy to navigate.'],['reliable_interaction','The interactive activities worked reliably.'],['clear_instructions','The instructions were clear.'],['useful_feedback','Check/feedback helped me learn.'],['useful_for_learning','The digital lesson was useful for learning English.'],['engaging','The lesson helped me stay engaged.'],['use_again','I would be willing to use E-LEAP again.'],['appropriate_for_course','E-LEAP is appropriate for this English course.']];
const reviewerItems=[['objective_alignment','The lesson aligns with its learning objectives.'],['pedagogical_quality','The lesson is pedagogically appropriate.'],['interaction_quality','The interactive activities support learning effectively.'],['assessment_feedback_quality','Assessment and feedback are appropriate.'],['usability','The lesson/platform is usable in real teaching.'],['applicability','The lesson/model is feasible for reuse or wider application.']];
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function init(){try{const r=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error('Please sign in first.');role=d?.user?.role||'student';dimension=['teacher','admin'].includes(role)?'quality':'usability';$('#title').textContent=dimension==='quality'?'Lesson / Model Quality Review':'Usability & Acceptance Feedback';renderQuestions()}catch(e){$('#questions').innerHTML=`<div class="notice">${esc(e.message)}</div>`}}
function renderQuestions(){const items=dimension==='quality'?reviewerItems:studentItems;$('#questions').innerHTML='<p class="muted">Rate each statement from 1 (strongly disagree) to 5 (strongly agree).</p>'+items.map(([id,text])=>`<div class="q"><b>${esc(text)}</b><div class="scale">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="${id}" value="${n}" required>${n}</label>`).join('')}</div></div>`).join('')}
$('#form').onsubmit=async e=>{e.preventDefault();if(!classId){$('#msg').innerHTML='<div class="notice">Missing class information.</div>';return}const items={};new FormData(e.currentTarget).forEach((v,k)=>{if(!['comment'].includes(k))items[k]=Number(v)});const payload={classId,sessionId,lessonId,dimension,instrument:dimension==='quality'?'e-leap-quality-v1':'e-leap-usability-acceptance-v1',items,comment:$('#comment').value,researchConsent:$('#consent').checked};try{const r=await fetch('/api/research/feedback',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not save feedback');$('#msg').innerHTML='<div class="notice">Feedback saved. Thank you.</div>';e.currentTarget.querySelector('button[type=submit]').disabled=true}catch(err){$('#msg').innerHTML=`<div class="notice">${esc(err.message)}</div>`}};init();
</script></body></html>
