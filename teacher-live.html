<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP · Live Session</title><link rel="stylesheet" href="assets/css/styles.css"><style>
:root{--g:#1d5b4c;--bg:#f4f7f5;--line:#dfe7e2;--muted:#60756e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:#173f38}.live-shell{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top a{text-decoration:none;color:var(--g);font-weight:800}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px;font-weight:700}.field input,.field select{min-height:44px;border:1px solid #cddbd4;border-radius:10px;padding:0 12px;font:inherit}.btn{min-height:42px;border:1px solid #cfe0d8;border-radius:10px;padding:0 14px;background:#fff;color:var(--g);font-weight:800;cursor:pointer}.btn.primary{background:var(--g);color:#fff;border-color:var(--g)}.btn.danger{color:#8a2f2f;border-color:#e6caca}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.session{display:grid;grid-template-columns:1fr auto;gap:20px}.code{font-size:46px;letter-spacing:.13em;font-weight:900;color:var(--g)}.qr{width:160px;height:160px;border:1px solid var(--line);border-radius:14px;padding:7px;background:#fff}.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}.metric-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.metric{border:1px solid var(--line);border-radius:14px;padding:14px}.metric b{font-size:28px;display:block}.list{display:grid;gap:8px}.row{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px}.row small{color:var(--muted)}.response{border:1px solid var(--line);border-radius:12px;padding:12px 14px}.response-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px}.response p{margin:5px 0;color:#294b42;overflow-wrap:anywhere}.hidden{display:none!important}.status{color:var(--muted);font-weight:700}@media(max-width:760px){.grid,.session{grid-template-columns:1fr}.metric-row{grid-template-columns:1fr}.qr{width:130px;height:130px}.code{font-size:36px}}
</style></head><body><main class="live-shell"><div class="top"><div><b>E-LEAP</b><div style="color:#60756e">R4 · Class / QR / Live Session</div></div><a href="index.html">← Back to platform</a></div>
<section class="panel" id="setup"><h1>Start Live Session</h1><p class="status">Create or choose a class, choose the lesson, then share the QR or join code.</p><div class="grid"><label class="field">Teacher name<input id="teacherName" placeholder="e.g. Ms Phuong"></label><label class="field">Class<select id="classSelect"><option value="__new__">+ Create a new class</option></select></label><label class="field hidden" id="newClassField">New class name<input id="className" placeholder="e.g. CKII-41"></label><label class="field">Lesson<select id="lesson"><option value="res-objective-first-b2-u01-l01">Objective First B2 · U1.1</option><option value="res-objective-first-b2-u01-l02">Objective First B2 · U1.2</option><option value="res-objective-first-b2-u02-l01">Objective First B2 · U2.1</option><option value="res-objective-first-b2-u02-l02">Objective First B2 · U2.2</option></select></label></div><div class="actions"><button class="btn primary" id="start">Create Live Session</button><span class="status" id="setupStatus"></span></div></section>
<section class="panel hidden" id="live"><div class="session"><div><div class="status">JOIN CODE</div><div class="code" id="joinCode"></div><div class="meta"><span id="classLabel"></span><span id="lessonLabel"></span><span id="sessionStatus"></span></div><div class="actions"><button class="btn" id="copyLink">Copy Join Link</button><a class="btn primary" id="openLesson" style="display:inline-flex;align-items:center;text-decoration:none">Open Lesson</a><button class="btn danger" id="end">End Session</button></div></div><img class="qr" id="qr" alt="Student join QR"></div><div class="metric-row"><div class="metric"><b id="participantCount">0</b><span>Joined students</span></div><div class="metric"><b id="responseCount">0</b><span>Submitted responses</span></div><div class="metric"><b id="activityCount">0</b><span>Activities with responses</span></div></div></section>
<section class="panel hidden" id="peoplePanel"><h2>Students</h2><div class="list" id="people"></div></section><section class="panel hidden" id="responsesPanel"><h2>Live Responses</h2><div class="list" id="responses"></div></section></main>
<script type="module">
import {R4Live} from './assets/js/r4-live-client.js';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
localStorage.setItem('e-leap-preview-role','teacher');
const pageParams=new URLSearchParams(location.search);const requestedLesson=pageParams.get('lesson'),requestedClassId=pageParams.get('classId');if(requestedLesson&&[...$('#lesson').options].some(o=>o.value===requestedLesson))$('#lesson').value=requestedLesson;
const teacherKey='e-leap-r4-teacher';let profile=JSON.parse(localStorage.getItem(teacherKey)||'null')||{teacherId:`teacher-${crypto.randomUUID?.()||Date.now()}`,name:''};localStorage.setItem(teacherKey,JSON.stringify(profile));
$('#teacherName').value=profile.name||'';let session=null,currentClass=null,poll=null;
async function loadClasses(){
  try{
    await R4Live.bootstrap();
    const d=await R4Live.getClasses({teacherId:profile.teacherId});
    const rows=d.classes||[];
    $('#classSelect').innerHTML=(rows.length?'<option value="">Choose a class…</option>':'')+rows.map(c=>`<option value="${esc(c.class_id)}">${esc(c.class_name)}</option>`).join('')+'<option value="__new__">+ Create a new class</option>';
    $('#classSelect').value=requestedClassId&&rows.some(c=>String(c.class_id)===String(requestedClassId))?String(requestedClassId):(rows.length?'':'__new__');
    syncClassField();
    $('#setupStatus').textContent='Live database ready';
  }catch(e){$('#setupStatus').textContent=e.message==='Live database is not configured'?'Live database not configured yet. Connect the Research DB in Vercel Environment Variables.':'Live setup: '+e.message;}
}
function syncClassField(){const isNew=$('#classSelect').value==='__new__';$('#newClassField').classList.toggle('hidden',!isNew);}
$('#classSelect').onchange=syncClassField;
function resourceName(id){if(id.includes('u02-l02'))return 'Objective First B2 · U2.2';if(id.includes('u02-l01'))return 'Objective First B2 · U2.1';if(id.endsWith('l02'))return 'Objective First B2 · U1.2';return 'Objective First B2 · U1.1'}
$('#start').onclick=async()=>{const name=$('#teacherName').value.trim(),lessonId=$('#lesson').value;if(!name)return $('#setupStatus').textContent='Enter teacher name.';profile.name=name;localStorage.setItem(teacherKey,JSON.stringify(profile));$('#setupStatus').textContent='Creating…';try{let classId=$('#classSelect').value;if(classId&&classId!=='__new__'){const d=await R4Live.getClasses({teacherId:profile.teacherId});currentClass=d.classes.find(x=>String(x.class_id)===classId)}else{const className=$('#className').value.trim();if(!className)throw new Error('Enter a class name.');const d=await R4Live.createClass({teacherId:profile.teacherId,className,courseId:'objective-first-b2',academicYear:'2026-2027'});currentClass=d.class;classId=currentClass.class_id}const d=await R4Live.createSession({classId,teacherId:profile.teacherId,lessonId,status:'active'});session=d.session;showLive();}catch(e){$('#setupStatus').textContent=e.message}};
function joinUrl(){return `${location.origin}${location.pathname.replace(/teacher-live\.html$/,'join.html')}?code=${encodeURIComponent(session.join_code)}`}
function showLive(){$('#setup').classList.add('hidden');$('#live').classList.remove('hidden');$('#peoplePanel').classList.remove('hidden');$('#responsesPanel').classList.remove('hidden');$('#joinCode').textContent=session.join_code;$('#classLabel').textContent=currentClass?.class_name||'Class';$('#lessonLabel').textContent=resourceName(session.lesson_id);$('#sessionStatus').textContent='Live';$('#qr').src=`/api/qr?text=${encodeURIComponent(joinUrl())}`;$('#openLesson').href=`engine/lesson-host.html?resource=${encodeURIComponent(session.lesson_id)}&sessionId=${encodeURIComponent(session.session_id)}&classId=${encodeURIComponent(session.class_id)}`;refresh();poll=setInterval(refresh,1500)}
$('#copyLink').onclick=async()=>{await navigator.clipboard.writeText(joinUrl());$('#copyLink').textContent='Copied ✓';setTimeout(()=>$('#copyLink').textContent='Copy Join Link',1200)};
$('#end').onclick=async()=>{if(!session)return;await R4Live.updateSession({sessionId:session.session_id,status:'ended'});clearInterval(poll);$('#sessionStatus').textContent='Ended';$('#end').disabled=true};
async function refresh(){if(!session)return;try{const [p,e]=await Promise.all([R4Live.participants(session.session_id),R4Live.events({sessionId:session.session_id})]);const people=p.participants||[],events=e.events||[],subs=events.filter(x=>x.event_type==='response.submitted');$('#participantCount').textContent=people.length;$('#responseCount').textContent=subs.length;$('#activityCount').textContent=new Set(subs.map(x=>x.activity_id).filter(Boolean)).size;$('#people').innerHTML=people.map(x=>`<div class="row"><div><b>${esc(x.display_name||'Student')}</b><small style="display:block">${esc(x.participant_code||'')}</small></div><small>${new Date(x.joined_at).toLocaleTimeString()}</small></div>`).join('')||'<div class="status">No students joined yet.</div>';const byId=Object.fromEntries(people.map(x=>[x.participant_id,x]));$('#responses').innerHTML=subs.slice().reverse().map(x=>{let meta=x.metadata||{};if(typeof meta==='string')try{meta=JSON.parse(meta)}catch{};const ans=x.answer??meta?.payload?.response??meta?.response??'';return `<article class="response"><div class="response-head"><b>${esc(byId[x.participant_id]?.display_name||x.participant_id||'Student')}</b><small>${esc(x.activity_id||'Activity')} · ${new Date(x.occurred_at).toLocaleTimeString()}</small></div><p>${esc(typeof ans==='string'?ans:JSON.stringify(ans))}</p></article>`}).join('')||'<div class="status">No submitted responses yet.</div>'}catch(e){console.warn(e)}}
await loadClasses();
</script></body></html>
