<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#073f32" />
  <title>E-LEAP · English Learning, Evaluation & Analytics Platform</title>
  <link rel="manifest" href="manifest.webmanifest?v=0.7" />
  <link rel="stylesheet" href="styles.css?v=0.7" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="src/app.js?v=0.7"></script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', async()=>{try{const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs){if(!r.active?.scriptURL.includes('service-worker.js?v=0.7')) await r.unregister();}await navigator.serviceWorker.register('./service-worker.js?v=0.7');}catch(e){console.warn(e);}});
  </script>
</body>
</html>
