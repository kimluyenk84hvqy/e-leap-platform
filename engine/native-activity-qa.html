<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP Native Activity QA</title><link rel="stylesheet" href="../assets/css/styles.css"><style>body{background:#f4f7f5;padding:24px;font-family:Arial,sans-serif;color:#153f35}.qa{max-width:900px;margin:auto}.native-card{background:#fff;border:1px solid #dfe7e2;border-radius:16px;padding:24px;margin:18px 0}.native-kicker{font-size:12px;font-weight:800;letter-spacing:.12em}.native-option{display:block;padding:10px;border:1px solid #dfe7e2;border-radius:10px;margin:8px 0}.native-card textarea{width:100%;box-sizing:border-box;padding:12px}.native-actions{display:flex;gap:16px;align-items:center;margin-top:16px}.native-actions button,[data-record]{padding:10px 16px;border:0;border-radius:10px;background:#1d5b4c;color:#fff;font-weight:700}.panel{background:#fff;border:1px solid #dfe7e2;border-radius:16px;padding:20px;margin-top:24px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #e8eeea;text-align:left}</style></head><body><main class="qa"><h1>Native Activity Contract QA</h1><p>Foundation test only — no real student identity is collected.</p><div id="activities"></div><section class="panel"><h2>Teacher Responses</h2><div id="responses">No submissions yet.</div></section><section class="panel"><h2>Progress</h2><div id="progress">0 / 3 submitted</div></section></main><script type="module">
import {ELeapLearningEvents,LocalEventSink} from '../assets/js/learning-events.js';import {ELeapNativeActivity} from '../assets/js/native-activity.js';import {LocalSubmissionStore} from '../assets/js/submissions.js';
const data=await (await fetch('../data/fixtures/native-activities.json')).json();const events=new ELeapLearningEvents({resourceId:data.resourceId,context:{mode:'self-study',shellId:'foundation-qa'},sink:new LocalEventSink(),source:'native'});const wrap=document.getElementById('activities');
for(const a of data.activities){const root=document.createElement('div');wrap.append(root);await new ELeapNativeActivity({root,activity:a,events,resourceId:data.resourceId,context:{mode:'self-study'}}).mount();}
function refresh(){const rows=new LocalSubmissionStore().all().filter(x=>x.resourceId===data.resourceId&&x.status!=='draft');document.getElementById('responses').innerHTML=rows.length?`<table><tr><th>Activity</th><th>Attempt</th><th>Status</th><th>Response</th><th>Score</th></tr>${rows.map(r=>`<tr><td>${r.activityId}</td><td>${r.attemptNo}</td><td>${r.status}</td><td>${String(r.response.value)}</td><td>${r.grading?.score??'Teacher review'}</td></tr>`).join('')}</table>`:'No submissions yet.';const done=new Set(rows.map(r=>r.activityId)).size;document.getElementById('progress').textContent=`${done} / ${data.activities.length} submitted`;}
wrap.addEventListener('e-leap:submission',refresh);refresh();
</script></body></html>
