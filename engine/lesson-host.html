<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP Lesson</title><link rel="stylesheet" href="../assets/css/styles.css"><style>
html,body{height:100%;margin:0}body{background:#f4f7f5}.host{height:100%;display:grid;grid-template-rows:auto 1fr}.hostbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:1px solid #dfe7e2;min-height:54px;box-sizing:border-box}.hostbar strong{color:#153f35}.hostbar small{color:#60756e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.hostbar .spacer{flex:1}.hostbar a,.hostbar button{min-height:38px;display:inline-flex;align-items:center;border-radius:10px;padding:0 12px;font:700 13px/1 system-ui;border:1px solid #cfe0d8;background:#fff;color:#1d5b4c;text-decoration:none;cursor:pointer}.hostbar button.primary{background:#1d5b4c;color:#fff;border-color:#1d5b4c}.hostbar button[hidden],#standalone[hidden]{display:none!important}.lesson-frame{width:100%;height:100%;border:0;background:white}.error{padding:32px;font:16px/1.5 system-ui;color:#7a2424}.stage{position:relative;min-height:0}.loading{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:linear-gradient(180deg,#f7faf8,#eef5f1);font:14px/1.5 system-ui;color:#48665d}.loading[hidden]{display:none}.loading-card{width:min(420px,calc(100% - 40px));padding:24px;border-radius:18px;background:#fff;border:1px solid #dbe8e1;box-shadow:0 12px 38px rgba(27,71,58,.08);text-align:center}.spinner{width:28px;height:28px;border:3px solid #dceae4;border-top-color:#1d5b4c;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading-actions{display:flex;justify-content:center;gap:8px;margin-top:14px}.loading-actions button{min-height:38px;padding:0 14px;border:1px solid #cfe0d8;border-radius:10px;background:#fff;color:#1d5b4c;font-weight:700;cursor:pointer}.host.presentation .hostbar{background:#102d25;color:#fff;border-bottom-color:#102d25}.host.presentation .hostbar strong,.host.presentation .hostbar small{color:#fff}.host.presentation #standalone,.host.presentation a[href="../index.html"]{display:none!important}.host.presentation #presentationToggle{margin-left:auto;background:#fff;color:#153f35;border-color:#fff}
@media(max-width:700px){.hostbar{padding:6px 8px;gap:6px;min-height:52px}.hostbar strong{font-size:14px}.hostbar small{font-size:11px;flex:1}.hostbar .spacer{display:none}.hostbar a,.hostbar button{font-size:11px;min-height:38px;padding:0 8px}.lesson-frame{min-height:calc(100dvh - 52px)}}
@media(max-width:430px){#standalone{display:none!important}.hostbar a[href="../index.html"]{font-size:0}.hostbar a[href="../index.html"]:after{content:"Back";font-size:11px}}
</style></head><body><main class="host" id="host"><header class="hostbar"><strong>E-LEAP</strong><small id="lessonName">Loading lesson…</small><span class="spacer"></span><button id="presentationToggle" class="primary" type="button" hidden>Presentation</button><a id="standalone" target="_blank" rel="noopener">Open standalone ↗</a><a href="../index.html">Back to platform</a></header><div id="stage" class="stage"><div id="loading" class="loading"><div class="loading-card"><div class="spinner" aria-hidden="true"></div><b id="loadingTitle">Opening lesson…</b><div id="loadingText">The lesson shell is loading. Media will continue loading in the background.</div><div class="loading-actions" id="loadingActions" hidden><button id="retryBtn" type="button">Retry lesson</button></div></div></div><iframe id="lessonFrame" class="lesson-frame" allow="microphone; autoplay; fullscreen" allowfullscreen></iframe></div></main><script type="module">
import {ELeapLessonEngine} from '../assets/js/lesson-engine.js';
import {ELeapLearningEvents,LocalEventSink} from '../assets/js/learning-events.js';
const params=new URLSearchParams(location.search);
const id=params.get('resource');
const allowedRoles=new Set(['guest','student','teacher','admin']);
const roleRaw=localStorage.getItem('e-leap-preview-role')||'guest';
const role=allowedRoles.has(roleRaw)?roleRaw:'guest';
let presentation=localStorage.getItem('e-leap-presentation-mode')==='1'&&['teacher','admin'].includes(role);
const core=(()=>{try{return JSON.parse(localStorage.getItem('e-leap-learning-core-v3')||localStorage.getItem('e-leap-learning-core-v2')||'{}')}catch{return {}}})();
const learnerKey=localStorage.getItem('e-leap-student-preview-key');
const learner=(core.learners||[]).find(x=>x.learnerKey===learnerKey)||null;
const memberships=(core.memberships||[]).filter(m=>m.learnerKey===learnerKey&&m.status==='active');
const frame=document.getElementById('lessonFrame');
const host=document.getElementById('host');
const loading=document.getElementById('loading');
const loadingTitle=document.getElementById('loadingTitle');
const loadingText=document.getElementById('loadingText');
const loadingActions=document.getElementById('loadingActions');
const retryBtn=document.getElementById('retryBtn');
const presentationToggle=document.getElementById('presentationToggle');
let currentResource=null;
let slowTimer=null, failTimer=null;
const context=()=>({role,mode:presentation?'presentation':'normal',participantId:role==='student'?learner?.researchId:null,classId:role==='student'?(memberships[0]?.classId||null):(params.get('classId')||null),sessionId:params.get('sessionId')||null});
function showLoading(){loading.hidden=false;loadingTitle.textContent='Opening lesson…';loadingText.textContent='The lesson shell is loading. Media will continue loading in the background.';loadingActions.hidden=true;clearTimeout(slowTimer);clearTimeout(failTimer);slowTimer=setTimeout(()=>{loadingTitle.textContent='Still loading…';loadingText.textContent='This lesson has private media. You can wait a little longer; the lesson will open as soon as its shell is ready.';},4000);failTimer=setTimeout(()=>{loadingTitle.textContent='Taking longer than expected';loadingText.textContent='You can retry the lesson without leaving the platform.';loadingActions.hidden=false;},12000)}
function hideLoading(){clearTimeout(slowTimer);clearTimeout(failTimer);loading.hidden=true}
function syncPresentationUI(){host.classList.toggle('presentation',presentation);presentationToggle.hidden=!['teacher','admin'].includes(role);presentationToggle.textContent=presentation?'Exit Presentation':'Presentation';presentationToggle.setAttribute('aria-pressed',presentation?'true':'false')}
function sendRuntimeContext(){try{frame.contentWindow?.postMessage({type:'e-leap:runtime-context',context:context()},location.origin)}catch(_){}}
function setPresentation(on){if(!['teacher','admin'].includes(role))return;presentation=!!on;presentation?localStorage.setItem('e-leap-presentation-mode','1'):localStorage.removeItem('e-leap-presentation-mode');syncPresentationUI();sendRuntimeContext()}
presentationToggle.addEventListener('click',()=>setPresentation(!presentation));
retryBtn.addEventListener('click',()=>{showLoading(); if(currentResource){ const engine=new ELeapLessonEngine({registryUrl:'../data/resources.json'}); engine.init().then(()=>engine.mountCompatibilityFrame(id,frame,{context:context(),cacheBust:true})).catch(e=>{loadingTitle.textContent='Lesson could not be opened';loadingText.textContent=e.message;loadingActions.hidden=false}) } else location.reload()});
frame.addEventListener('load',()=>{const src=frame.getAttribute('src')||'';if(!src||!src.includes('eleapHosted=1'))return;hideLoading();sendRuntimeContext();});
showLoading();syncPresentationUI();
try{
  if(!id) throw new Error('Missing lesson resource ID.');
  const engine=await new ELeapLessonEngine({registryUrl:'../data/resources.json'}).init();
  const r=engine.mountCompatibilityFrame(id,frame,{context:context()}); currentResource=r;
  document.title=`${r.name} · E-LEAP`; document.getElementById('lessonName').textContent=r.name;
  const standalone=document.getElementById('standalone'); const restrictedStandalone=['student','guest'].includes(role);
  if(restrictedStandalone){standalone.hidden=true;standalone.removeAttribute('href');standalone.setAttribute('aria-hidden','true');standalone.style.display='none';standalone.addEventListener('click',(ev)=>ev.preventDefault());}
  else {standalone.href='../'+r.source.standaloneUrl;standalone.hidden=false;standalone.removeAttribute('aria-hidden');standalone.style.removeProperty('display');}
  const sink=new LocalEventSink();
  const eventContext=()=>{const c=context();return {mode:c.mode==='presentation'?'presentation':(role==='student'?'self-study':role),role:c.role,classId:c.classId,sessionId:c.sessionId,participantId:c.participantId}};
  const events=new ELeapLearningEvents({resourceId:id,context:eventContext(),sink,source:'compatibility-bridge'}); await events.emit('lesson.opened');
  window.addEventListener('message',async(ev)=>{if(ev.source!==frame.contentWindow)return;if(ev.origin!==location.origin)return;const msg=ev.data;if(!msg)return;if(msg.type==='e-leap:request-runtime-context'){sendRuntimeContext();return;}if(msg.type!=='e-leap:learning-event'||!msg.event)return;const incoming=msg.event;if(incoming.resourceId!==id)return;const allowed=new Set(['activity.viewed','response.drafted','response.submitted','attempt.checked','media.played','media.completed','progress.updated','feedback.created']);if(!allowed.has(incoming.eventType))return;const normalized={...incoming,context:{...incoming.context,...eventContext()},source:'compatibility-bridge'};await sink.write(normalized);globalThis.dispatchEvent(new CustomEvent('e-leap:learning-event',{detail:normalized}));});
  window.addEventListener('pagehide',()=>events.emit('lesson.closed'));
}catch(e){clearTimeout(slowTimer);clearTimeout(failTimer);loading.hidden=true;document.getElementById('stage').innerHTML=`<div class="error"><b>Lesson could not be opened.</b><br>${e.message}</div>`;document.getElementById('standalone').hidden=true;presentationToggle.hidden=true;}
if('serviceWorker' in navigator){navigator.serviceWorker.register('../service-worker.js').catch(()=>{});}
</script></body></html>
