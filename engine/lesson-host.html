<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP Lesson</title><link rel="stylesheet" href="../assets/css/styles.css"><style>
html,body{height:100%;margin:0}body{background:#f4f7f5}.host{height:100%;display:grid;grid-template-rows:auto 1fr}.hostbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:#fff;border-bottom:1px solid #dfe7e2}.hostbar strong{color:#153f35}.hostbar small{color:#60756e}.hostbar .spacer{flex:1}.hostbar a{color:#1d5b4c;text-decoration:none;font-weight:700}#standalone[hidden]{display:none!important}.lesson-frame{width:100%;height:100%;border:0;background:white}.error{padding:32px;font:16px/1.5 system-ui;color:#7a2424}
.hostbar{min-height:56px}.hostbar a{min-height:44px;display:inline-flex;align-items:center;padding:0 6px}.hostbar small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media(max-width:700px){.host{grid-template-rows:auto 1fr}.hostbar{padding:6px 9px;gap:8px;min-height:52px}.hostbar strong{font-size:14px}.hostbar small{font-size:11px;flex:1}.hostbar .spacer{display:none}.hostbar a{font-size:11px;min-height:40px;padding:0 4px}.lesson-frame{min-height:calc(100dvh - 52px)}}
@media(max-width:430px){#standalone{display:none}.hostbar a[href="../index.html"]{font-size:0}.hostbar a[href="../index.html"]:after{content:"Back";font-size:11px}}
</style></head><body><main class="host"><header class="hostbar"><strong>E-LEAP</strong><small id="lessonName">Loading lesson…</small><span class="spacer"></span><a id="standalone" target="_blank" rel="noopener">Open standalone ↗</a><a href="../index.html">Back to platform</a></header><div id="stage"><iframe id="lessonFrame" class="lesson-frame" allow="microphone; autoplay; fullscreen" allowfullscreen></iframe></div></main><script type="module">
import {ELeapLessonEngine} from '../assets/js/lesson-engine.js';
import {ELeapLearningEvents,LocalEventSink} from '../assets/js/learning-events.js';
const params=new URLSearchParams(location.search);
const id=params.get('resource');
const allowedRoles=new Set(['guest','student','teacher','admin']);
const roleRaw=localStorage.getItem('e-leap-preview-role')||'guest';
const role=allowedRoles.has(roleRaw)?roleRaw:'guest';
const presentation=localStorage.getItem('e-leap-presentation-mode')==='1'&&['teacher','admin'].includes(role);
const core=(()=>{try{return JSON.parse(localStorage.getItem('e-leap-learning-core-v3')||localStorage.getItem('e-leap-learning-core-v2')||'{}')}catch{return {}}})();
const learnerKey=localStorage.getItem('e-leap-student-preview-key');
const learner=(core.learners||[]).find(x=>x.learnerKey===learnerKey)||null;
const memberships=(core.memberships||[]).filter(m=>m.learnerKey===learnerKey&&m.status==='active');
const hostContext={role,mode:presentation?'presentation':'normal',participantId:role==='student'?learner?.researchId:null,classId:role==='student'?(memberships[0]?.classId||null):(params.get('classId')||null),sessionId:params.get('sessionId')||null};
const stage=document.getElementById('stage');
try{ if(!id) throw new Error('Missing lesson resource ID.'); const engine=await new ELeapLessonEngine({registryUrl:'../data/resources.json'}).init(); const r=engine.mountCompatibilityFrame(id,document.getElementById('lessonFrame'),{context:hostContext}); document.title=`${r.name} · E-LEAP`; document.getElementById('lessonName').textContent=r.name; const standalone=document.getElementById('standalone'); const restrictedStandalone=['student','guest'].includes(role); if(restrictedStandalone){ standalone.hidden=true; standalone.removeAttribute('href'); standalone.setAttribute('aria-hidden','true'); standalone.style.display='none'; standalone.addEventListener('click',(ev)=>ev.preventDefault()); } else { standalone.href='../'+r.source.standaloneUrl; standalone.hidden=false; standalone.removeAttribute('aria-hidden'); standalone.style.removeProperty('display'); } const mode=hostContext.mode==='presentation'?'presentation':(role==='student'?'self-study':role); const sink=new LocalEventSink(); const events=new ELeapLearningEvents({resourceId:id,context:{mode,role:hostContext.role,classId:hostContext.classId,sessionId:hostContext.sessionId,participantId:hostContext.participantId},sink,source:'compatibility-bridge'}); await events.emit('lesson.opened');
window.addEventListener('message',async(ev)=>{const frame=document.getElementById('lessonFrame'); if(ev.source!==frame.contentWindow)return; if(ev.origin!==location.origin)return; const msg=ev.data; if(!msg||msg.type!=='e-leap:learning-event'||!msg.event)return; const incoming=msg.event; if(incoming.resourceId!==id)return; const allowed=new Set(['activity.viewed','response.drafted','response.submitted','attempt.checked','media.played','media.completed','progress.updated','feedback.created']); if(!allowed.has(incoming.eventType))return; const normalized={...incoming,context:{...incoming.context,mode,role:hostContext.role,classId:hostContext.classId,sessionId:hostContext.sessionId,participantId:hostContext.participantId},source:'compatibility-bridge'}; await sink.write(normalized); globalThis.dispatchEvent(new CustomEvent('e-leap:learning-event',{detail:normalized})); });
window.addEventListener('pagehide',()=>events.emit('lesson.closed')); }
catch(e){stage.innerHTML=`<div class="error"><b>Lesson could not be opened.</b><br>${e.message}</div>`;document.getElementById('standalone').hidden=true;}
</script></body></html>
