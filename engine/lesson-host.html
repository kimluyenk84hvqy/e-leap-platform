<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP Lesson</title><link rel="stylesheet" href="../assets/css/styles.css"><style>
html,body{height:100%;margin:0}body{background:#f4f7f5}.host{height:100%;display:grid;grid-template-rows:auto 1fr}.hostbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:1px solid #dfe7e2;min-height:54px;box-sizing:border-box}.hostbar strong{color:#153f35}.hostbar small{color:#60756e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.hostbar .spacer{flex:1}.rolebadge{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border-radius:999px;background:#edf5f1;color:#315f52;font:700 12px/1 system-ui;white-space:nowrap}.host.presentation .rolebadge{background:#24483f;color:#fff}.hostbar a,.hostbar button{min-height:38px;display:inline-flex;align-items:center;border-radius:10px;padding:0 12px;font:700 13px/1 system-ui;border:1px solid #cfe0d8;background:#fff;color:#1d5b4c;text-decoration:none;cursor:pointer}.hostbar button.primary{background:#1d5b4c;color:#fff;border-color:#1d5b4c}.hostbar button[hidden],#standalone[hidden]{display:none!important}.lesson-frame{width:100%;height:100%;border:0;background:white}.error{padding:32px;font:16px/1.5 system-ui;color:#7a2424}.stage{position:relative;min-height:0}.loading{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:linear-gradient(180deg,#f7faf8,#eef5f1);font:14px/1.5 system-ui;color:#48665d}.loading[hidden]{display:none}.loading-card{width:min(420px,calc(100% - 40px));padding:24px;border-radius:18px;background:#fff;border:1px solid #dbe8e1;box-shadow:0 12px 38px rgba(27,71,58,.08);text-align:center}.spinner{width:28px;height:28px;border:3px solid #dceae4;border-top-color:#1d5b4c;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading-actions{display:flex;justify-content:center;gap:8px;margin-top:14px}.loading-actions button{min-height:38px;padding:0 14px;border:1px solid #cfe0d8;border-radius:10px;background:#fff;color:#1d5b4c;font-weight:700;cursor:pointer}.host.presentation .hostbar{background:#102d25;color:#fff;border-bottom-color:#102d25}.host.presentation .hostbar strong,.host.presentation .hostbar small{color:#fff}.host.presentation #standalone,.host.presentation a[href="../index.html"]{display:none!important}.host.presentation #hostPresentationBtn{background:#fff;color:#153f35;border-color:#fff}
@media(max-width:700px){.hostbar{padding:6px 8px;gap:6px;min-height:52px}.hostbar strong{font-size:14px}.hostbar small{font-size:11px;flex:1}.hostbar .spacer{display:none}.hostbar a,.hostbar button{font-size:11px;min-height:38px;padding:0 8px}.lesson-frame{min-height:calc(100dvh - 52px)}}
@media(max-width:430px){#standalone{display:none!important}.hostbar a[href="../index.html"]{font-size:0}.hostbar a[href="../index.html"]:after{content:"Back";font-size:11px}}
.unified-controls{display:flex;align-items:center;gap:8px}.unified-controls .count{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#e9f3ef;color:#1d5b4c;font-size:11px}.host-modal{position:fixed;inset:0;z-index:50;background:#102d25aa;display:grid;place-items:center;padding:20px}.host-modal[hidden]{display:none}.host-modal-card{position:relative;width:min(760px,94vw);max-height:82vh;overflow:auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 24px 70px #0004;font:14px/1.45 system-ui;color:#173f38}.host-modal-close{position:absolute;right:12px;top:10px;border:0!important;background:transparent!important;font-size:26px!important;padding:4px 8px!important}.host-modal-card h2{margin:0 0 8px}.host-muted{color:#60756e}.host-empty{padding:22px;border:1px dashed #c9dcd3;border-radius:14px;text-align:center;color:#60756e}.host-response{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid #e4ece8}.host-response span,.host-response small{color:#60756e}.host-timer-display{font-size:76px;font-weight:900;text-align:center;color:#1d5b4c;margin:20px 0}.host-timer-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.host-timer-actions button{min-height:38px;border:1px solid #cfe0d8;border-radius:10px;background:#fff;color:#1d5b4c;font-weight:700;padding:0 12px}@media(max-width:800px){.unified-controls #hostTimerBtn,.unified-controls #hostResponsesBtn{font-size:0}.unified-controls #hostTimerBtn:after{content:"Timer";font-size:11px}.unified-controls #hostResponsesBtn:after{content:"Responses";font-size:11px}.unified-controls #hostEditBtn{display:none!important}}

.unified-controls .host-practice-pill{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border-radius:999px;background:#f3f6f4;color:#60756e;font:700 11px/1 system-ui;white-space:nowrap}.unified-controls .host-score-pill{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border-radius:999px;background:#edf5f1;color:#1d5b4c;font:800 11px/1 system-ui;white-space:nowrap}.host-confirm-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.host-confirm-actions button{min-height:40px;border:1px solid #cfe0d8;border-radius:10px;background:#fff;color:#1d5b4c;font-weight:800;padding:0 14px;cursor:pointer}.host-confirm-actions button.primary{background:#1d5b4c;color:#fff;border-color:#1d5b4c}.unified-controls .host-submit:disabled{opacity:.72;cursor:default}.host-modal-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.host-response-total{white-space:nowrap;background:#edf5f1;color:#315f52;border-radius:999px;padding:7px 10px;font-weight:800;font-size:12px}.host-response-card{border:1px solid #e1ebe6;border-radius:14px;padding:12px 14px;margin:10px 0;background:#fbfdfc}.host-response-head{display:grid;grid-template-columns:minmax(120px,1fr) minmax(120px,1fr) auto;gap:10px;align-items:center}.host-response-head span,.host-response-head small{color:#60756e}.host-response-body{margin-top:9px;padding-top:9px;border-top:1px solid #edf2ef;color:#24483f;overflow-wrap:anywhere}.host-response-score{margin-top:7px;font-size:12px;font-weight:800;color:#315f52}@media(max-width:900px){.unified-controls{gap:5px}.unified-controls .host-practice-pill,.unified-controls .host-score-pill{display:none}.host-response-head{grid-template-columns:1fr auto}.host-response-head span{grid-column:1}.host-response-head small{grid-column:2;grid-row:1}}@media(max-width:700px){.unified-controls #hostTimerBtn,.unified-controls #hostResponsesBtn{padding:0 7px}.unified-controls #hostEditBtn{display:none!important}.unified-controls #hostSubmitBtn,.unified-controls #hostPresentationBtn{padding:0 9px}}
</style></head><body><main class="host" id="host"><header class="hostbar"><strong>E-LEAP</strong><small id="lessonName">Loading lesson…</small><span class="spacer"></span><span id="roleBadge" class="rolebadge"></span><button id="presentationToggle" class="primary" type="button" hidden>Presentation</button><a id="standalone" target="_blank" rel="noopener">Open standalone ↗</a><a href="../index.html">Back to platform</a></header><div id="stage" class="stage"><div id="loading" class="loading"><div class="loading-card"><div class="spinner" aria-hidden="true"></div><b id="loadingTitle">Opening lesson…</b><div id="loadingText">The lesson shell is loading. Media will continue loading in the background.</div><div class="loading-actions" id="loadingActions" hidden><button id="retryBtn" type="button">Retry lesson</button></div></div></div><iframe id="lessonFrame" class="lesson-frame" allow="microphone; autoplay; fullscreen" allowfullscreen></iframe></div></main><script type="module">
import {ELeapLessonEngine} from '../assets/js/lesson-engine.js';
import {ELeapLearningEvents,LocalEventSink} from '../assets/js/learning-events.js';
import {UnifiedLessonControls} from '../assets/js/unified-lesson-controls.js';
const params=new URLSearchParams(location.search);
const id=params.get('resource');
const allowedRoles=new Set(['guest','student','teacher','admin']);
const roleRaw=localStorage.getItem('e-leap-preview-role')||'guest';
const role=allowedRoles.has(roleRaw)?roleRaw:'guest';
let presentation=false;
// Presentation is a transient teaching mode. Never inherit stale mode from a previous lesson/session.
try{localStorage.removeItem('e-leap-presentation-mode')}catch(_){}
const core=(()=>{try{return JSON.parse(localStorage.getItem('e-leap-learning-core-v3')||localStorage.getItem('e-leap-learning-core-v2')||'{}')}catch{return {}}})();
const learnerKey=localStorage.getItem('e-leap-student-preview-key');
const learner=(core.learners||[]).find(x=>x.learnerKey===learnerKey)||null;
const memberships=(core.memberships||[]).filter(m=>m.learnerKey===learnerKey&&m.status==='active');
const liveStored=(()=>{try{return JSON.parse(localStorage.getItem('e-leap-r4-live-context')||'null')}catch{return null}})();
const frame=document.getElementById('lessonFrame');
const host=document.getElementById('host');
const loading=document.getElementById('loading');
const loadingTitle=document.getElementById('loadingTitle');
const loadingText=document.getElementById('loadingText');
const loadingActions=document.getElementById('loadingActions');
const retryBtn=document.getElementById('retryBtn');
const presentationToggle=document.getElementById('presentationToggle');
const roleBadge=document.getElementById('roleBadge');
let currentResource=null;
let slowTimer=null, failTimer=null;
let unifiedControls=null;
const context=()=>({role,mode:presentation?'presentation':'normal',participantId:role==='student'?(params.get('participantId')||liveStored?.participantId||learner?.researchId||null):null,classId:role==='student'?(params.get('classId')||liveStored?.classId||memberships[0]?.classId||null):(params.get('classId')||null),sessionId:params.get('sessionId')||liveStored?.sessionId||null,joinCode:params.get('joinCode')||liveStored?.joinCode||null,studentId:role==='student'?(liveStored?.studentId||learner?.studentId||null):null});
function showLoading(){loading.hidden=false;loadingTitle.textContent='Opening lesson…';loadingText.textContent='The lesson shell is loading. Media will continue loading in the background.';loadingActions.hidden=true;clearTimeout(slowTimer);clearTimeout(failTimer);slowTimer=setTimeout(()=>{loadingTitle.textContent='Still loading…';loadingText.textContent='This lesson has private media. You can wait a little longer; the lesson will open as soon as its shell is ready.';},4000);failTimer=setTimeout(()=>{loadingTitle.textContent='Taking longer than expected';loadingText.textContent='You can retry the lesson without leaving the platform.';loadingActions.hidden=false;},12000)}
function hideLoading(){clearTimeout(slowTimer);clearTimeout(failTimer);loading.hidden=true}
function syncPresentationUI(){host.classList.toggle('presentation',presentation);const labels={guest:'Guest practice',student:'Student',teacher:'Teacher',admin:'Admin'};roleBadge.textContent=presentation?'Presentation':(labels[role]||'Guest practice');roleBadge.dataset.role=role;if(unifiedControls){unifiedControls.presentation=presentation;unifiedControls.sync()}else{presentationToggle.hidden=!['teacher','admin'].includes(role);presentationToggle.textContent=presentation?'Exit Presentation':'Presentation';presentationToggle.setAttribute('aria-pressed',presentation?'true':'false')}}
function sendRuntimeContext(){try{frame.contentWindow?.postMessage({type:'e-leap:runtime-context',context:context()},location.origin)}catch(_){}}
let shellPoll=null;
function stopShellPoll(){if(shellPoll){clearInterval(shellPoll);shellPoll=null}}
function watchLessonShell(){stopShellPoll();let ticks=0;shellPoll=setInterval(()=>{ticks++;try{const d=frame.contentDocument;if(d&&d.body&&d.body.children.length){hideLoading();stopShellPoll();sendRuntimeContext();return}}catch(_){}if(ticks>80)stopShellPoll();},100)}
function setPresentation(on){if(!['teacher','admin'].includes(role))return;presentation=!!on;syncPresentationUI();sendRuntimeContext()}

retryBtn.addEventListener('click',()=>{showLoading(); if(currentResource){ const engine=new ELeapLessonEngine({registryUrl:'../data/resources.json'}); engine.init().then(()=>{engine.mountCompatibilityFrame(id,frame,{context:context(),cacheBust:true});watchLessonShell()}).catch(e=>{loadingTitle.textContent='Lesson could not be opened';loadingText.textContent=e.message;loadingActions.hidden=false}) } else location.reload()});
frame.addEventListener('load',()=>{const src=frame.getAttribute('src')||'';if(!src||!src.includes('eleapHosted=1'))return;stopShellPoll();hideLoading();sendRuntimeContext();});
showLoading();syncPresentationUI();
unifiedControls=new UnifiedLessonControls({frame,role,resourceId:id,onPresentationChange:(on)=>setPresentation(on),canEdit:role==='admin',studentId:context().studentId});syncPresentationUI();
const GOLDEN_ROUTES={
  'res-objective-first-b2-u01-l01':{name:'U1.1 · Fashion Matters',standaloneUrl:'resources/objective-first-b2/u01/l01/standalone/index.html'},
  'res-objective-first-b2-u01-l02':{name:'U1.2 · Fashion Matters',standaloneUrl:'resources/objective-first-b2/u01/l02/standalone/index.html'}
};
function mountDirectGolden(resourceId){
  const g=GOLDEN_ROUTES[resourceId]; if(!g)return null;
  const url=new URL('../'+g.standaloneUrl,location.href);
  url.searchParams.set('eleapHosted','1');url.searchParams.set('eleapRole',context().role||'guest');url.searchParams.set('eleapMode',context().mode||'normal');
  if(context().sessionId)url.searchParams.set('sessionId',context().sessionId);if(context().classId)url.searchParams.set('classId',context().classId);if(context().participantId)url.searchParams.set('participantId',context().participantId);
  url.searchParams.set('_hostv','r4-rc1.4.1');
  frame.src=url.pathname+url.search; frame.title=`${g.name} — E-LEAP lesson`; return {id:resourceId,name:g.name,source:{standaloneUrl:g.standaloneUrl}};
}
try{
  if(!id) throw new Error('Missing lesson resource ID.');
  // Golden References open immediately and do not wait for registry/cache.
  currentResource=mountDirectGolden(id);
  if(currentResource){watchLessonShell();document.title=`${currentResource.name} · E-LEAP`;document.getElementById('lessonName').textContent=currentResource.name;}
  const engine=await new ELeapLessonEngine({registryUrl:'../data/resources.json'}).init();
  const r=currentResource||engine.mountCompatibilityFrame(id,frame,{context:context()}); currentResource=r; if(!GOLDEN_ROUTES[id])watchLessonShell();
  document.title=`${r.name} · E-LEAP`; document.getElementById('lessonName').textContent=r.name;
  const standalone=document.getElementById('standalone'); const restrictedStandalone=['student','guest'].includes(role);
  if(restrictedStandalone){standalone.hidden=true;standalone.removeAttribute('href');standalone.setAttribute('aria-hidden','true');standalone.style.display='none';standalone.addEventListener('click',(ev)=>ev.preventDefault());}
  else {standalone.href='../'+r.source.standaloneUrl;standalone.hidden=false;standalone.removeAttribute('aria-hidden');standalone.style.removeProperty('display');}
  const sink=new LocalEventSink();
  const eventContext=()=>{const c=context();return {mode:c.mode==='presentation'?'presentation':(role==='student'?'self-study':role),role:c.role,classId:c.classId,sessionId:c.sessionId,participantId:c.participantId,studentId:c.studentId,joinCode:c.joinCode}};
  const remoteSessionId=context().sessionId;
  const postRemoteEvent=async(evt)=>{
    if(!remoteSessionId||role!=='student')return;
    const answer=evt?.payload?.response??null;
    try{await fetch('../api/research/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientEventId:evt.eventId,sessionId:remoteSessionId,classId:context().classId,participantId:context().participantId,lessonId:id,activityId:evt.activityId||null,eventType:evt.eventType,answer,isCorrect:evt?.payload?.isCorrect??evt?.payload?.correct??null,score:evt?.payload?.score??null,occurredAt:evt.occurredAt,metadata:{source:'r4-live-session',studentId:context().studentId,payload:evt.payload||{},context:evt.context||{}}})})}catch(err){console.warn('R4 remote event sync failed',err)}
  };
  let remoteResponsePoll=null;
  const loadRemoteResponses=async()=>{
    if(!remoteSessionId||!['teacher','admin'].includes(role))return;
    try{const r=await fetch(`../api/research/events?sessionId=${encodeURIComponent(remoteSessionId)}`,{cache:'no-store'});if(!r.ok)return;const d=await r.json();const rows=(d.events||[]).filter(x=>x.event_type==='response.submitted').map(x=>{let meta=x.metadata||{};if(typeof meta==='string'){try{meta=JSON.parse(meta)}catch{meta={}}}return {eventId:x.client_event_id||x.event_id,eventType:x.event_type,occurredAt:x.occurred_at,resourceId:x.lesson_id,activityId:x.activity_id,context:{role:'student',participantId:x.participant_id,sessionId:x.session_id,classId:x.class_id,studentId:meta.studentId||null},payload:{...(meta?.payload||{}),response:x.answer??meta?.payload?.response??null,score:x.score??meta?.payload?.score??null}}});unifiedControls?.setResponses(rows)}catch(err){console.warn('R4 response poll failed',err)}
  };
  if(remoteSessionId&&['teacher','admin'].includes(role)){loadRemoteResponses();remoteResponsePoll=setInterval(loadRemoteResponses,1500);window.addEventListener('pagehide',()=>clearInterval(remoteResponsePoll),{once:true});}
  unifiedControls?.setResponses(sink.read().filter(e=>e?.resourceId===id));
  const events=new ELeapLearningEvents({resourceId:id,context:eventContext(),sink,source:'compatibility-bridge'}); await events.emit('lesson.opened');
  window.addEventListener('message',async(ev)=>{if(ev.source!==frame.contentWindow)return;if(ev.origin!==location.origin)return;const msg=ev.data;if(!msg)return;if(msg.type==='e-leap:request-runtime-context'){sendRuntimeContext();return;}if(msg.type!=='e-leap:learning-event'||!msg.event)return;const incoming=msg.event;if(incoming.resourceId!==id)return;const allowed=new Set(['activity.viewed','response.drafted','response.submitted','attempt.checked','media.played','media.completed','progress.updated','feedback.created']);if(!allowed.has(incoming.eventType))return;const normalized={...incoming,context:{...incoming.context,...eventContext()},source:'compatibility-bridge'};const guestPractice=role==='guest';const learnerStateEvent=['response.drafted','response.submitted','attempt.checked','progress.updated'].includes(normalized.eventType);if(!(guestPractice&&learnerStateEvent)){unifiedControls?.addResponse(normalized);await sink.write(normalized);if(role==='student'&&context().sessionId){await postRemoteEvent(normalized);}}globalThis.dispatchEvent(new CustomEvent('e-leap:learning-event',{detail:normalized}));});
  window.addEventListener('pagehide',()=>events.emit('lesson.closed'));
}catch(e){clearTimeout(slowTimer);clearTimeout(failTimer);loading.hidden=true;document.getElementById('stage').innerHTML=`<div class="error"><b>Lesson could not be opened.</b><br>${e.message}</div>`;document.getElementById('standalone').hidden=true;presentationToggle.hidden=true;}
// Preview stability pass: avoid stale mixed-version lesson assets from an older service worker.
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});}
if('caches' in globalThis){caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('e-leap-')).map(k=>caches.delete(k)))).catch(()=>{});}
</script></body></html>
