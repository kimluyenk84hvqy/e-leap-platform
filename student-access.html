<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP · Join Class</title><style>:root{--g:#1f4d3a;--bg:#f2f7f4;--line:#d7e4dc;--muted:#60756e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:#173f38;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 18px 45px #173f3812}h1{margin:0 0 8px}.muted{color:var(--muted);line-height:1.5}label{display:grid;gap:7px;font-weight:800;margin-top:16px}input{min-height:48px;border:1px solid #cbdad2;border-radius:11px;padding:0 13px;font:inherit}button{margin-top:20px;width:100%;min-height:48px;border:0;border-radius:11px;background:var(--g);color:#fff;font-weight:900;font-size:16px;cursor:pointer}.status{min-height:24px;margin-top:12px;font-weight:700}.brand{font-weight:900;color:var(--g)}.join-code{margin:14px 0 4px;padding:11px 13px;border-radius:12px;background:#edf6f1;border:1px solid #d4e7dc;font-weight:800}.hidden{display:none!important}small{color:var(--muted);font-weight:600;line-height:1.4}</style></head><body><main class="card"><div class="brand">E-LEAP</div><h1>Join Live Class</h1><p class="muted">Enter your Student ID, full name and 6-digit PIN. No email or platform account is required.</p><div class="join-code" id="codeDisplay"></div><form id="f"><label id="manualCodeField" class="hidden">Class PIN / Join code<input id="code" maxlength="12" autocomplete="one-time-code"></label><label>Student ID<input id="studentId" maxlength="64" autocomplete="username" placeholder="e.g. CKI51001" required></label><label>Full name<input id="name" maxlength="160" autocomplete="name" placeholder="Enter your full name" required></label><label>6-digit PIN<input id="pin" type="password" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="current-password" placeholder="6 digits" required><small>Use the same PIN if you join again with this Student ID.</small></label><button>Join Class</button><div class="status" id="status"></div></form></main><script type="module">
const $=s=>document.querySelector(s),p=new URLSearchParams(location.search),profileKey='e-leap-r4-student-profile';
const saved=JSON.parse(localStorage.getItem(profileKey)||'null')||{};
const qrCode=(p.get('code')||'').trim().toUpperCase();
$('#code').value=qrCode;
$('#studentId').value=saved.studentId||'';
$('#name').value=saved.fullName||'';
if(qrCode){$('#codeDisplay').textContent=`Class code: ${qrCode}`;}else{$('#codeDisplay').textContent='Enter the class PIN / join code below.';$('#manualCodeField').classList.remove('hidden');}
function norm(v){return String(v||'').trim().toUpperCase().normalize('NFKC').replace(/[^A-Z0-9]/g,'')}
$('#f').onsubmit=async e=>{e.preventDefault();const joinCode=$('#code').value.trim().toUpperCase(),studentId=norm($('#studentId').value),displayName=$('#name').value.trim(),pin=$('#pin').value.trim();if(!joinCode)return $('#status').textContent='Class PIN / join code is required.';if(!studentId)return $('#status').textContent='Student ID is required.';if(displayName.length<2)return $('#status').textContent='Please enter your full name.';if(!/^\d{6}$/.test(pin))return $('#status').textContent='PIN must contain exactly 6 digits.';$('#status').textContent='Joining class…';try{const r=await fetch('/api/research/participants',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({joinCode,studentId,displayName,pin})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Unable to join');localStorage.setItem(profileKey,JSON.stringify({studentId:d.user.student_id,fullName:d.user.display_name}));localStorage.setItem('e-leap-student-id',d.user.student_id);localStorage.setItem('e-leap-preview-role','student');const live={joinCode,sessionId:d.session.session_id,classId:d.session.class_id,participantId:d.participant.participant_id,studentId:d.user.student_id,fullName:d.user.display_name,lessonId:d.session.lesson_id};localStorage.setItem('e-leap-r4-live-context',JSON.stringify(live));$('#status').textContent='Joined ✓';const q=new URLSearchParams({resource:d.session.lesson_id,sessionId:d.session.session_id,classId:d.session.class_id,participantId:d.participant.participant_id,joinCode});setTimeout(()=>location.href='/engine/lesson-host.html?'+q,250)}catch(err){$('#status').textContent=err.message||'Unable to join';}};
</script></body></html>
