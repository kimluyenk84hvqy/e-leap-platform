<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP · Student access</title><style>:root{--g:#1f4d3a;--bg:#f2f7f4;--line:#d7e4dc;--muted:#60756e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:#173f38;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px}h1{margin:0 0 8px}.muted{color:var(--muted)}label{display:grid;gap:7px;font-weight:800;margin-top:16px}input{min-height:48px;border:1px solid #cbdad2;border-radius:11px;padding:0 13px;font:inherit;text-transform:none}button{margin-top:20px;width:100%;min-height:48px;border:0;border-radius:11px;background:var(--g);color:#fff;font-weight:900;font-size:16px}.status{min-height:24px;margin-top:12px;font-weight:700}.brand{font-weight:900;color:var(--g)}</style></head><body><main class="card"><div class="brand">E-LEAP</div><h1>Join your class</h1><p class="muted">Use your Student ID every time. It becomes your stable E-LEAP identity. A valid class join code is required.</p><form id="f"><label>Join code<input id="code" maxlength="12" autocomplete="one-time-code" required></label><label>Student ID<input id="studentId" maxlength="64" autocomplete="username" required></label><label>Your name<input id="name" maxlength="160" required></label><label>Student PIN<input id="pin" type="password" minlength="6" autocomplete="current-password" required><small>Use the same PIN on future joins.</small></label><button>Join class</button><div class="status" id="status"></div></form></main><script type="module">const p=new URLSearchParams(location.search);code.value=(p.get('code')||'').toUpperCase();f.onsubmit=async e=>{e.preventDefault();status.textContent='Joining…';try{const r=await fetch('/api/research/participants',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({joinCode:code.value,studentId:studentId.value,displayName:name.value,pin:pin.value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Unable to join');localStorage.setItem('e-leap-student-id',d.user.student_id);localStorage.setItem('e-leap-preview-role','student');status.textContent='Joined ✓';const q=new URLSearchParams({resource:d.session.lesson_id,sessionId:d.session.session_id,classId:d.session.class_id});setTimeout(()=>location.href='/engine/lesson-host.html?'+q,500)}catch(err){status.textContent=err.message||'Unable to join';}};</script></body></html>
