function setPart(p){part=p;document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',i===p));if(slides[idx].t==='actions')renderPart();else renderMall()}
function renderPart(){const a=part===0?jobs.slice(0,4):jobs.slice(4);document.getElementById('partArea').innerHTML=`<div class="grid">${a.map((j,k)=>{let global=part===0?k:k+4;return `<div class="job"><div class="visual"><span class="num">${global+1}</span>${j[1]}</div><div class="job-body">${input(actions[global])}</div></div>`}).join('')}</div>`;bindInputs()}
function renderMall(){const a=part===0?mall.slice(0,3):mall.slice(3);const offs=part===0?0:3;document.getElementById('partArea').innerHTML=`<div class="grid">${a.map((x,k)=>`<div class="job"><div class="visual"><span class="num">${offs+k+1}</span>${['🎨','📸','🧍','📝','🏦'][offs+k]}</div><div class="job-body">${input(x)}</div></div>`).join('')}</div>`;bindInputs()}
function bindInputs(){document.querySelectorAll('.answer').forEach((el,n)=>el.addEventListener('change',()=>saveResponse(el,n)))}
function saveResponse(el,n){const key=`u3:${idx}:${n}`;localStorage.setItem(key,el.value);refreshBoard()}
function refreshBoard(){const b=document.getElementById('board');let rows=[];for(let k=0;k<localStorage.length;k++){let key=localStorage.key(k);if(key.startsWith(`u3:${idx}:`))rows.push(`<div class="resp"><b>${key.split(':').pop()}</b> · ${esc(localStorage.getItem(key))}</div>`)}b.innerHTML=`<b>Responses · Slide ${idx+1}</b>${rows.join('')||'<div class="small">No local responses yet.</div>'}`}
function nextReveal(){let cards=[...document.querySelectorAll('#seq .card')];if(revealStep<cards.length-1){revealStep++;cards[revealStep].classList.add('show');cards[revealStep].scrollIntoView({behavior:'smooth',block:'center'})}}
document.getElementById('showAns').onclick=()=>document.querySelectorAll('.answer').forEach(e=>{e.value=e.dataset.answer||e.value;e.classList.add('reveal')});document.getElementById('reset').onclick=()=>{document.querySelectorAll('.answer').forEach(e=>{e.value='';e.classList.remove('reveal')});document.querySelectorAll('input[type=radio]').forEach(r=>{r.checked=false;r.closest('.option').classList.remove('correct')})};document.getElementById('check').onclick=()=>{document.querySelectorAll('.answer').forEach(e=>{if(e.dataset.answer&&e.value.trim().toLowerCase()===e.dataset.answer.trim().toLowerCase())e.classList.add('reveal')});document.querySelectorAll('input[type=radio]:checked').forEach(r=>{if(r.value===r.dataset.correct)r.closest('.option').classList.add('correct')})};document.getElementById('responses').onclick=()=>{document.getElementById('board').classList.toggle('open');refreshBoard()};document.getElementById('timerBtn').onclick=()=>{if(timerId){clearInterval(timerId);timerId=null;return}timerId=setInterval(()=>{timerSec++;let m=String(Math.floor(timerSec/60)).padStart(2,'0'),s=String(timerSec%60).padStart(2,'0');document.getElementById('timer').textContent=`${m}:${s}`},1000)};document.getElementById('liveBtn').onclick=()=>{let url=location.href;alert(`OFFLINE LIVE CLASS\n\nJoin URL: ${url}\n\nIf this file is opened directly, responses are local to this browser. For multi-device classroom use, open it through the optional local server included with the backup.`)};document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render()}};document.getElementById('next').onclick=()=>{if(idx<slides.length-1){idx++;render()}};document.getElementById('teacherMode').onclick=()=>{teacher=true;document.body.classList.remove('student');document.getElementById('teacherMode').classList.add('active');document.getElementById('studentMode').classList.remove('active')};document.getElementById('studentMode').onclick=()=>{teacher=false;document.body.classList.add('student');document.getElementById('studentMode').classList.add('active');document.getElementById('teacherMode').classList.remove('active')};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&idx<slides.length-1){idx++;render()}if(e.key==='ArrowLeft'&&idx>0){idx--;render()}});render();
</script></body></html>
