<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP · Join Class</title><link rel="stylesheet" href="assets/css/styles.css"><style>body{margin:0;background:#f4f7f5;font-family:Inter,system-ui,sans-serif;color:#173f38}.wrap{max-width:560px;margin:6vh auto;padding:18px}.card{background:#fff;border:1px solid #dfe7e2;border-radius:20px;padding:26px;box-shadow:0 18px 45px #173f3812}.brand{font-weight:900;color:#1d5b4c}.field{display:grid;gap:6px;margin:14px 0;font-weight:700}.field input{min-height:46px;border:1px solid #cddbd4;border-radius:10px;padding:0 12px;font:inherit}.btn{width:100%;min-height:46px;border:0;border-radius:10px;background:#1d5b4c;color:#fff;font-weight:900;cursor:pointer}.muted{color:#60756e;line-height:1.5}.status{margin-top:12px;color:#60756e;font-weight:700}.pin-note{font-size:12px;color:#60756e;line-height:1.45}.code-box{margin:14px 0;padding:10px 12px;border:1px solid #d4e7dc;border-radius:10px;background:#edf6f1;font-weight:800}.hidden{display:none!important}</style></head><body><main class="wrap"><section class="card"><div class="brand">E-LEAP</div><h1>Join Live Class</h1><p class="muted">Enter your Student ID, full name and 6-digit PIN. No email or separate platform sign-in is required.</p><div class="code-box" id="codeDisplay"></div><label class="field hidden" id="manualCodeField">Class PIN / Join code<input id="code" maxlength="12" autocomplete="one-time-code"></label><label class="field">Student ID<input id="studentId" autocomplete="username" placeholder="School student code"></label><label class="field">Full name<input id="fullName" autocomplete="name"></label><label class="field">6-digit PIN<input id="pin" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="current-password" placeholder="6 digits"></label><div class="pin-note">Use the same PIN if you join again with this Student ID.</div><button class="btn" id="join">Join Class</button><div class="status" id="status"></div></section></main><script type="module">
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search),profileKey='e-leap-r4-student-profile';const saved=JSON.parse(localStorage.getItem(profileKey)||'null')||{};const qrCode=(params.get('code')||'').trim().toUpperCase();$('#code').value=qrCode;$('#studentId').value=saved.studentId||'';$('#fullName').value=saved.fullName||'';if(qrCode){$('#codeDisplay').textContent=`Class code: ${qrCode}`;}else{$('#codeDisplay').textContent='Enter the class PIN / join code below.';$('#manualCodeField').classList.remove('hidden');}
function norm(v){return String(v||'').trim().toUpperCase().normalize('NFKC').replace(/[^A-Z0-9]/g,'')}
$('#join').onclick=async()=>{const joinCode=$('#code').value.trim().toUpperCase(),studentId=norm($('#studentId').value),displayName=$('#fullName').value.trim(),pin=$('#pin').value.trim();if(!joinCode)return $('#status').textContent='Class PIN / join code is required.';if(!studentId)return $('#status').textContent='Student ID is required.';if(displayName.length<2)return $('#status').textContent='Please enter your full name.';if(!/^\d{6}$/.test(pin))return $('#status').textContent='PIN must contain exactly 6 digits.';$('#status').textContent='Joining class…';try{const r=await fetch('/api/research/participants',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({joinCode,studentId,displayName,pin})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Unable to join');const live={joinCode,sessionId:d.session.session_id,classId:d.session.class_id,participantId:d.participant.participant_id,studentId:d.user.student_id,fullName:d.user.display_name,lessonId:d.session.lesson_id};localStorage.setItem(profileKey,JSON.stringify({studentId:live.studentId,fullName:live.fullName}));localStorage.setItem('e-leap-r4-live-context',JSON.stringify(live));localStorage.setItem('e-leap-preview-role','student');$('#status').textContent='Joined ✓';const q=new URLSearchParams({resource:d.session.lesson_id,sessionId:d.session.session_id,classId:d.session.class_id,participantId:d.participant.participant_id,joinCode});setTimeout(()=>location.href='/engine/lesson-host.html?'+q,250)}catch(e){$('#status').textContent=e.message||'Unable to join'}};
</script></body></html>
