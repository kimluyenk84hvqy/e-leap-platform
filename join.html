<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP · Join Class</title><link rel="stylesheet" href="assets/css/styles.css"><style>
body{margin:0;background:#f4f7f5;font-family:Inter,system-ui,sans-serif;color:#173f38}.wrap{max-width:560px;margin:8vh auto;padding:18px}.card{background:#fff;border:1px solid #dfe7e2;border-radius:20px;padding:26px;box-shadow:0 18px 45px #173f3812}.brand{font-weight:900;color:#1d5b4c}.field{display:grid;gap:6px;margin:14px 0;font-weight:700}.field input{min-height:46px;border:1px solid #cddbd4;border-radius:10px;padding:0 12px;font:inherit}.btn{width:100%;min-height:46px;border:0;border-radius:10px;background:#1d5b4c;color:#fff;font-weight:900;cursor:pointer}.muted{color:#60756e}.status{margin-top:12px;color:#60756e;font-weight:700}.guest{display:block;text-align:center;margin-top:18px;color:#60756e;text-decoration:none;font-weight:700}
</style></head><body><main class="wrap"><section class="card"><div class="brand">E-LEAP</div><h1>Join Live Class</h1><p class="muted">Use your existing school Student ID and full name. Your class is selected automatically from the session code.</p><label class="field">Join code<input id="code" maxlength="8" autocomplete="one-time-code"></label><label class="field">Student ID<input id="studentId" autocomplete="username" placeholder="School student code"></label><label class="field">Full name<input id="fullName" autocomplete="name"></label><button class="btn" id="join">Join Class</button><div class="status" id="status"></div><a class="guest" href="index.html">Continue as Guest Practice instead</a></section></main><script type="module">
import {R4Live} from './assets/js/r4-live-client.js';
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search),profileKey='e-leap-r4-student-profile';const saved=JSON.parse(localStorage.getItem(profileKey)||'null')||{};$('#code').value=(params.get('code')||'').toUpperCase();$('#studentId').value=saved.studentId||'';$('#fullName').value=saved.fullName||'';
$('#join').onclick=async()=>{const joinCode=$('#code').value.trim().toUpperCase(),studentId=$('#studentId').value.trim(),fullName=$('#fullName').value.trim();if(!joinCode||!studentId||!fullName)return $('#status').textContent='Enter join code, Student ID and full name.';$('#status').textContent='Joining…';try{const d=await R4Live.join({joinCode,participantCode:studentId,displayName:fullName});const p=d.participant,s=d.session;const live={joinCode,sessionId:s.session_id,classId:s.class_id,participantId:p.participant_id,studentId,fullName,lessonId:s.lesson_id};localStorage.setItem(profileKey,JSON.stringify({studentId,fullName}));localStorage.setItem('e-leap-r4-live-context',JSON.stringify(live));localStorage.setItem('e-leap-preview-role','student');location.href=`engine/lesson-host.html?resource=${encodeURIComponent(s.lesson_id)}&sessionId=${encodeURIComponent(s.session_id)}&classId=${encodeURIComponent(s.class_id)}&participantId=${encodeURIComponent(p.participant_id)}&joinCode=${encodeURIComponent(joinCode)}`;}catch(e){$('#status').textContent=e.message}};
</script></body></html>
