<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP · One-time Admin Setup</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f2f7f4;color:#173f38;margin:0;padding:30px}.card{max-width:560px;margin:auto;background:#fff;padding:28px;border:1px solid #d7e4dc;border-radius:18px}label{display:grid;gap:6px;margin:14px 0;font-weight:800}input{padding:12px;border:1px solid #cbdad2;border-radius:10px;font:inherit}button{padding:12px 18px;border:0;border-radius:10px;background:#1f4d3a;color:#fff;font-weight:900}.note{color:#60756e}.status{margin-top:14px;font-weight:700}</style></head><body><main class="card"><h1>One-time Admin Setup</h1><p class="note">Use once after deployment. Requires the server environment variable <b>E_LEAP_ADMIN_BOOTSTRAP_KEY</b>. After the first Admin is created, this endpoint refuses additional setup.</p><form id="f"><label>Admin name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Password (10+ characters)<input id="password" type="password" minlength="10" required></label><label>Bootstrap key<input id="key" type="password" required></label><button>Create Admin</button><div id="s" class="status"></div></form></main><script>f.onsubmit=async e=>{e.preventDefault();s.textContent='Creating…';const r=await fetch('/api/auth/setup-admin',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({displayName:name.value,email:email.value,password:password.value,bootstrapKey:key.value})});const d=await r.json().catch(()=>({}));s.textContent=r.ok?'Admin created. You are signed in.':(d.error||'Setup failed');if(r.ok)setTimeout(()=>location.href='/index.html',900)};</script></body></html>
