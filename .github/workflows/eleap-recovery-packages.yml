name: E-LEAP Recovery Packages

on:
  workflow_dispatch:
    inputs:
      include_core:
        description: "Also build immutable Core candidate package"
        required: false
        default: false
        type: boolean
  push:
    branches: [marking-center-v1]
    paths:
      - 'data/**'
      - 'lessons/**'
      - 'content/**'
      - 'assets/media/**'
      - 'assets/lessons/**'
      - 'docs/GOLDEN_ACCESS_POLICY.md'
  schedule:
    - cron: '20 18 * * *'

permissions:
  contents: read

jobs:
  live-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build content snapshot
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          SHA="${GITHUB_SHA}"
          mkdir -p recovery/live-content
          for p in data lessons content assets/media assets/lessons docs/GOLDEN_ACCESS_POLICY.md; do
            if [ -e "$p" ]; then
              mkdir -p "recovery/live-content/$(dirname "$p")"
              cp -R "$p" "recovery/live-content/$p"
            fi
          done
          cat > recovery/live-content/MANIFEST.json <<EOF
          {
            "package": "ELEAP_LIVE_CONTENT",
            "created_at_utc": "$TS",
            "commit_sha": "$SHA",
            "branch": "${GITHUB_REF_NAME}",
            "policy": "Published/Approved learner content only; package contains no runtime secrets"
          }
          EOF
          (cd recovery/live-content && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd recovery && zip -qr "ELEAP_LIVE_CONTENT_${TS}.zip" live-content)
          cp "recovery/ELEAP_LIVE_CONTENT_${TS}.zip" recovery/ELEAP_LIVE_CONTENT_LATEST.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ELEAP_LIVE_CONTENT_LATEST
          path: |
            recovery/ELEAP_LIVE_CONTENT_LATEST.zip
            recovery/ELEAP_LIVE_CONTENT_*.zip
          retention-days: 30
          if-no-files-found: error

  core-candidate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_core == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build Core candidate
        shell: bash
        run: |
          set -euo pipefail
          TS="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          mkdir -p recovery/core
          rsync -a ./ recovery/core/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'recovery/' \
            --exclude 'data/' \
            --exclude 'lessons/' \
            --exclude 'content/' \
            --exclude 'assets/media/' \
            --exclude 'assets/lessons/' \
            --exclude '.env*' \
            --exclude '*.key' \
            --exclude '*.pem'
          cat > recovery/core/GOLDEN_RELEASE_MANIFEST.json <<EOF
          {
            "package": "ELEAP_CORE_GOLDEN_CANDIDATE",
            "created_at_utc": "$TS",
            "commit_sha": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "warning": "Promote to GOLDEN only after final functional, schema and dependency gates pass"
          }
          EOF
          (cd recovery/core && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd recovery && zip -qr "ELEAP_CORE_GOLDEN_CANDIDATE_${TS}.zip" core)
      - uses: actions/upload-artifact@v4
        with:
          name: ELEAP_CORE_GOLDEN_CANDIDATE
          path: recovery/ELEAP_CORE_GOLDEN_CANDIDATE_*.zip
          retention-days: 90
          if-no-files-found: error
