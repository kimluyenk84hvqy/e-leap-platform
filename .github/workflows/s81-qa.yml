name: E-LEAP S8.1 QA
on:
  push:
    branches: ["qa/s81"]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - run: node --experimental-vm-modules --test tests/*.test.mjs
