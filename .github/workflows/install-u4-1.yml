name: Install Objective PET B1 U4.1

on:
  push:
    branches:
      - integrate/objective-pet-b1-u4-1
    paths:
      - incoming/Objective_PET_B1_U4_1_ELEAP_CLASSROOM_FEEDBACK_REVIEW_V2.zip

permissions:
  contents: write

jobs:
  install-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate/objective-pet-b1-u4-1
          fetch-depth: 0

      - name: Unpack approved U4.1 package
        shell: bash
        run: |
          set -euo pipefail
          ZIP='incoming/Objective_PET_B1_U4_1_ELEAP_CLASSROOM_FEEDBACK_REVIEW_V2.zip'
          test -f "$ZIP"
          rm -rf /tmp/u41
          mkdir -p /tmp/u41
          unzip -q "$ZIP" -d /tmp/u41
          BASE='/tmp/u41/resources/objective-pet-b1/u04/l01'
          test -f "$BASE/lesson.json"
          test -f "$BASE/standalone/index.html"
          test -f "$BASE/standalone/lesson-data.js"
          test -f "$BASE/standalone/app.js"
          test -f "$BASE/standalone/styles.css"
          test -f "$BASE/standalone/lesson-access.js"
          rm -rf resources/objective-pet-b1/u04/l01
          mkdir -p resources/objective-pet-b1/u04/l01
          cp -R "$BASE"/. resources/objective-pet-b1/u04/l01/

      - name: Upgrade U4.1 hosted adapter to current E-LEAP contract
        shell: bash
        run: |
          set -euo pipefail
          cat > resources/objective-pet-b1/u04/l01/standalone/lesson-access.js <<'JS'
          (function(){
            const RESOURCE_ID='res-objective-pet-b1-u04-l01';
            const p=new URLSearchParams(location.search);
            const hosted=p.get('eleapHosted')==='1'||window.self!==window.top;
            if(hosted){
              document.documentElement.classList.add('hosted');
              document.addEventListener('DOMContentLoaded',()=>document.body.classList.add('hosted'));
            }
            const app=()=>window.ELEAPApp;
            let runtimeContext={};
            const eventId=()=>globalThis.crypto?.randomUUID?.()||`u41-${Date.now()}-${Math.random().toString(16).slice(2)}`;
            function responseForPlatform(response){
              if(!response)return null;
              if(Array.isArray(response.inputs))return response;
              if(response && typeof response==='object')return {
                inputs:Object.entries(response).map(([name,value])=>({name,type:typeof value==='boolean'?'checkbox':'text',value,checked:typeof value==='boolean'?value:undefined})),
                raw:response
              };
              return response;
            }
            function postLearningEvent(eventType,state){
              if(!hosted||!state?.activityId)return;
              const a=state.assessment||{};
              const event={eventId:eventId(),eventType,occurredAt:new Date().toISOString(),resourceId:RESOURCE_ID,activityId:state.activityId,
                context:{...runtimeContext},payload:{response:responseForPlatform(state.response),assessment:state.assessment??null,grading:state.assessment??null,
                score:a.percentage??a.score??null,correctCount:a.correctCount??null,totalCount:a.totalCount??null,answeredCount:a.answeredCount??null,state:state.state??null,
                screenId:state.screen?.id??null,screenIndex:state.screen?.index??null,tab:state.screen?.tab??null}};
              try{window.parent?.postMessage({type:'e-leap:learning-event',event},location.origin)}catch(_){ }
            }
            window.addEventListener('message',ev=>{
              if(ev.source!==window.parent||ev.origin!==location.origin)return;
              const d=ev.data||{};
              if(d.type==='e-leap:runtime-context'){runtimeContext={...(d.context||{})};return;}
              if(d.type==='ELEAP_COMMAND'&&d.action)window.ELEAP_LESSON_HOST_API.command(d.action,d.payload);
              if(d.type==='ELEAP_SET_MODE')window.ELEAP_LESSON_HOST_API.setMode(d.mode);
              if(d.type==='ELEAP_SET_SCREEN')window.ELEAP_LESSON_HOST_API.setScreen(d.target);
              if(d.type==='ELEAP_SET_ACTIVITY')window.ELEAP_LESSON_HOST_API.setActivity(d.activityId);
            });
            window.ELEAP_LESSON_HOST_API={
              apiVersion:'1.2',resourceId:RESOURCE_ID,
              setMode(mode){const r=app()?.setMode?.(mode);return r!==false},
              getMode(){return app()?.getMode?.()||document.body?.dataset?.mode||'student'},
              getActivityState(){return app()?.getActivityState?.()||null},
              command(action,payload){
                const key=String(action||'').toLowerCase();
                const r=app()?.command?.(action,payload);
                if(r===false||r==null)return false;
                const state=app()?.getActivityState?.()||r;
                if(key==='check')postLearningEvent('attempt.checked',state);
                else if(key==='submit')postLearningEvent('response.submitted',state);
                return true;
              },
              setScreen(target){const r=app()?.setScreen?.(target);return r!==false&&r!=null},
              setActivity(activityId){const r=app()?.setActivity?.(activityId);return r!==false&&r!=null},
              next(){const r=app()?.command?.('next');return r!==false&&r!=null},
              previous(){const r=app()?.command?.('previous');return r!==false&&r!=null},
              getResourceId(){return RESOURCE_ID},
              getScreenCount(){return window.LESSON?.screens?.length||0}
            };
            window.ELEAPLesson=window.ELEAP_LESSON_HOST_API;
            window.addEventListener('ELEAP_APP_READY',()=>{
              try{window.parent?.postMessage({type:'ELEAP_LESSON_READY',resourceId:RESOURCE_ID},location.origin)}catch(_){ }
              if(hosted){try{window.parent?.postMessage({type:'e-leap:request-runtime-context'},location.origin)}catch(_){ }}
            });
          })();
          JS

      - name: Register U4.1 resource and placement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          lesson=json.loads(Path('resources/objective-pet-b1/u04/l01/lesson.json').read_text())
          regp=Path('data/resources.json'); d=json.loads(regp.read_text())
          rid='res-objective-pet-b1-u04-l01'; pid='placement-objective-pet-b1-u04-l01'; sid='objective-pet-b1-u04-l01'
          r={
            'id':rid,'name':"U4.1 · Let's Go Out — Entertainment & Time",'type':'interactive-lesson','version':lesson['version'],'status':'approved-review',
            'source':{'kind':'lesson-data','path':'resources/objective-pet-b1/u04/l01/lesson.json','standaloneUrl':'resources/objective-pet-b1/u04/l01/standalone/index.html','package':'Objective_PET_B1_U4_1_ELEAP_CLASSROOM_FEEDBACK_REVIEW_V2.zip'},
            'capabilities':['classroom','self-study','presentation','responses','progress','live-class'],
            'copyright':{'reviewStatus':'private-course-material','trafficLight':'amber','usageScope':'private-educational-use'}
          }
          p={'id':pid,'resourceId':rid,'shellId':sid,'order':1,'status':'active'}
          d['resources']=[x for x in d.get('resources',[]) if x.get('id')!=rid]+[r]
          d['placements']=[x for x in d.get('placements',[]) if x.get('id')!=pid]+[p]
          regp.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n')
          shells=json.loads(Path('data/course-shells.json').read_text())
          assert any(x.get('id')==sid for x in shells.get('shells',[])), 'U4.1 shell missing'
          PY

      - name: Add U4.1 to Live Class compatibility list
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path('teacher-live.html'); s=p.read_text()
          option='<option value="res-objective-pet-b1-u04-l01">Objective PET B1 · U4.1 · Let’s Go Out</option>'
          if 'value="res-objective-pet-b1-u04-l01"' not in s:
              anchor=r'(<option[^>]+value="res-objective-pet-b1-u03-l02"[^>]*>.*?</option>)'
              s,n=re.subn(anchor,lambda m:m.group(1)+option,s,count=1,flags=re.S)
              assert n==1, 'Could not locate U3.2 Live Class option'
          m=re.search(r'function resourceName\(id\)\{[^\n]*\}',s)
          assert m, 'resourceName helper missing'
          fn=m.group(0)
          if "res-objective-pet-b1-u04-l01" not in fn:
              fn=fn.replace("if(id.includes('adv-writing-letter-email-writing-informal-l01'))", "if(id==='res-objective-pet-b1-u04-l01')return\"Objective PET B1 · U4.1 · Let’s Go Out\";if(id.includes('adv-writing-letter-email-writing-informal-l01'))")
              s=s[:m.start()]+fn+s[m.end():]
          p.write_text(s)
          PY

      - name: Static QA
        shell: bash
        run: |
          set -euo pipefail
          BASE='resources/objective-pet-b1/u04/l01'
          node --check "$BASE/standalone/app.js"
          node --check "$BASE/standalone/lesson-access.js"
          node --check "$BASE/standalone/lesson-data.js"
          python - <<'PY'
          import json,re
          from pathlib import Path
          base=Path('resources/objective-pet-b1/u04/l01'); st=base/'standalone'
          lesson=json.loads((base/'lesson.json').read_text())
          assert lesson['resourceId']=='res-objective-pet-b1-u04-l01'
          assert lesson['shellId']=='objective-pet-b1-u04-l01'
          assert len(lesson['screenMap'])==19
          ids=[x['id'] for x in lesson['activityMap']]
          assert len(ids)==11 and len(ids)==len(set(ids))
          data=(st/'lesson-data.js').read_text(); access=(st/'lesson-access.js').read_text(); css=(st/'styles.css').read_text()
          assert 'ELEAP_LESSON_HOST_API' in access and "apiVersion:'1.2'" in access
          assert "response.submitted" in access and "attempt.checked" in access
          assert "body.classList.add('hosted')" in access
          assert 'body.hosted .offline-bar{display:none!important}' in css
          refs=set(re.findall(r'assets/(?:images|audio|video)/[^\"\'\\\s,}]+',data))
          missing=[x for x in sorted(refs) if not (st/x).exists()]
          assert not missing, f'Missing media: {missing}'
          reg=json.loads(Path('data/resources.json').read_text())
          assert sum(x.get('id')=='res-objective-pet-b1-u04-l01' for x in reg['resources'])==1
          assert sum(x.get('id')=='placement-objective-pet-b1-u04-l01' for x in reg['placements'])==1
          assert 'res-objective-pet-b1-u04-l01' in Path('teacher-live.html').read_text()
          print('U4.1 static QA PASS; screens=19 activities=11 mediaRefs=',len(refs))
          PY

      - name: Commit clean installed resource
        shell: bash
        run: |
          set -euo pipefail
          rm -f incoming/Objective_PET_B1_U4_1_ELEAP_CLASSROOM_FEEDBACK_REVIEW_V2.zip
          rmdir incoming 2>/dev/null || true
          git config user.name 'E-LEAP Installer'
          git config user.email 'actions@users.noreply.github.com'
          git add resources/objective-pet-b1/u04/l01 data/resources.json teacher-live.html incoming || true
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
          else
            git commit -m 'Install Objective PET B1 U4.1 with current E-LEAP host bridge'
            git push origin HEAD:integrate/objective-pet-b1-u4-1
          fi
