<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP · User access</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f2f7f4;color:#173f38;margin:0;padding:24px}.wrap{max-width:900px;margin:auto}.panel{background:#fff;border:1px solid #d7e4dc;border-radius:18px;padding:22px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:6px;font-weight:800}input,select{padding:11px;border:1px solid #cbdad2;border-radius:10px;font:inherit}button{padding:11px 16px;border:0;border-radius:10px;background:#1f4d3a;color:#fff;font-weight:900}.row{display:grid;grid-template-columns:1.4fr 1fr .7fr .7fr;gap:8px;padding:10px 0;border-bottom:1px solid #edf2ef}.muted{color:#60756e}@media(max-width:700px){.grid,.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="panel"><h1>Access management</h1><p class="muted">Admin only. Create Teacher/Admin accounts here. Student identities are created by a valid class join code + Student ID.</p><form id="f" class="grid"><label>Name<input id="name" required></label><label>Role<select id="role"><option value="teacher">Teacher</option><option value="admin">Admin</option></select></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" minlength="10" required></label><div><button>Create account</button></div><div id="status" class="muted"></div></form></section><section class="panel"><h2>Users</h2><div id="users"></div></section></main><script type="module">import{Auth}from'./assets/js/auth-client.js';const me=await Auth.require(['admin']);if(!me)throw new Error('redirect');async function load(){const d=await Auth.api('/api/auth/users');users.innerHTML=d.users.map(u=>`<div class="row"><b>${u.display_name}</b><span>${u.email||u.student_id||''}</span><span>${u.role}</span><span>${u.status}</span></div>`).join('')}f.onsubmit=async e=>{e.preventDefault();status.textContent='Creating…';try{await Auth.api('/api/auth/users',{method:'POST',body:JSON.stringify({displayName:name.value,role:role.value,email:email.value,password:password.value})});status.textContent='Created ✓';f.reset();await load()}catch(err){status.textContent=err.message}};await load();</script></body></html>
