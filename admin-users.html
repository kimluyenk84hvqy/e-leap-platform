<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP · User access</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f2f7f4;color:#173f38;margin:0;padding:24px}.wrap{max-width:980px;margin:auto}.panel{background:#fff;border:1px solid #d7e4dc;border-radius:18px;padding:22px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:6px;font-weight:800}input,select{padding:11px;border:1px solid #cbdad2;border-radius:10px;font:inherit}button{padding:11px 16px;border:0;border-radius:10px;background:#1f4d3a;color:#fff;font-weight:900;cursor:pointer}.quiet{background:#edf4f0;color:#1f4d3a}.row{display:grid;grid-template-columns:1.4fr 1.2fr .7fr .9fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #edf2ef;align-items:center}.muted{color:#60756e}.small{font-size:12px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top a{color:#1f4d3a;font-weight:800;text-decoration:none}.ok{color:#176b44;font-weight:800}.err{color:#9a3131;font-weight:800}@media(max-width:760px){.grid,.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><h1>Access management</h1><p class="muted">Admin only · Teacher onboarding and account recovery.</p></div><a href="./">← E-LEAP</a></div><section class="panel"><h2>Create Teacher/Admin</h2><p class="muted small">Teacher accounts use a temporary password and must create a new password at first sign-in. Admin accounts use the password created here.</p><form id="accountForm" class="grid"><label>Name<input id="accountName" required></label><label>Role<select id="accountRole"><option value="teacher" selected>Teacher</option><option value="admin">Admin</option></select></label><label>Email<input id="accountEmail" type="email" required></label><label><span id="pwLabel">Temporary password</span><input id="accountPassword" type="password" minlength="10" required></label><div><button id="createBtn" type="submit">Create account</button></div><div id="formStatus" class="muted" aria-live="polite"></div></form></section><section class="panel"><h2>Users</h2><div id="usersList"></div></section></main><script type="module">import{Auth}from'./assets/js/auth-client.js';const me=await Auth.require(['admin']);if(!me)throw new Error('redirect');const form=document.getElementById('accountForm'),nameEl=document.getElementById('accountName'),roleEl=document.getElementById('accountRole'),emailEl=document.getElementById('accountEmail'),passwordEl=document.getElementById('accountPassword'),pwLabel=document.getElementById('pwLabel'),statusEl=document.getElementById('formStatus'),usersEl=document.getElementById('usersList'),createBtn=document.getElementById('createBtn');roleEl.onchange=()=>pwLabel.textContent=roleEl.value==='teacher'?'Temporary password':'Password';async function load(){const d=await Auth.api('/api/auth/users');usersEl.innerHTML=d.users.map(u=>`<div class="row"><b>${u.display_name}</b><span>${u.email||u.student_id||''}</span><span>${u.role}</span><span>${u.role==='teacher'?(u.must_change_password?'Must change password':'Active password'):u.status}</span><span>${u.role==='teacher'?`<button class="quiet" data-reset="${u.user_id}" data-name="${String(u.display_name||'').replace(/"/g,'&quot;')}">Reset password</button>`:''}</span></div>`).join('');usersEl.querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{const pw=prompt(`Temporary password for ${b.dataset.name} (minimum 10 characters):`);if(!pw)return;if(pw.length<10)return alert('Use at least 10 characters.');try{await Auth.api('/api/auth/users',{method:'PATCH',body:JSON.stringify({userId:b.dataset.reset,password:pw})});alert('Password reset. Teacher must create a new password at next sign-in.');await load()}catch(err){alert(err.message)}})}form.onsubmit=async e=>{e.preventDefault();statusEl.className='muted';statusEl.textContent='Creating…';createBtn.disabled=true;try{const payload={displayName:nameEl.value.trim(),role:roleEl.value,email:emailEl.value.trim(),password:passwordEl.value};const d=await Auth.api('/api/auth/users',{method:'POST',body:JSON.stringify(payload)});statusEl.className='ok';statusEl.textContent=`${d.user.role==='teacher'?'Teacher':'Admin'} created ✓`;form.reset();roleEl.value='teacher';pwLabel.textContent='Temporary password';await load()}catch(err){statusEl.className='err';statusEl.textContent=err.message||'Could not create account.'}finally{createBtn.disabled=false}};await load();</script></body></html>
