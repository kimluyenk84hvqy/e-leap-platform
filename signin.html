<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP Sign in</title><link rel="stylesheet" href="assets/css/styles.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f2f7f4}.auth-card{width:min(460px,100%);background:#fff;border:1px solid #d3e2d9;border-radius:18px;padding:28px;box-shadow:0 18px 50px #173f3114}.auth-brand{font-weight:800;font-size:26px;color:#1f4d3a}.auth-sub{color:#60766d;margin:6px 0 22px}.auth-card label{display:block;font-weight:700;font-size:12px;margin:14px 0 6px}.auth-card input{width:100%;padding:12px 13px;border:1px solid #cbdad1;border-radius:10px;font:inherit}.auth-actions{display:flex;gap:10px;align-items:center;margin-top:20px}.auth-actions button{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.auth-actions .primary{background:#1f4d3a;color:#fff}.auth-actions .quiet{background:#edf4f0;color:#1f4d3a}.auth-error{min-height:20px;color:#9a3131;font-size:12px;margin-top:12px}.auth-note{font-size:11px;color:#7a8d86;margin-top:18px;line-height:1.5}</style></head><body><main class="auth-card"><div class="auth-brand">E-LEAP</div><div class="auth-sub">Sign in to continue with your assigned role.</div><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><div class="auth-actions"><button class="primary" type="submit">Sign in</button><button class="quiet" id="guestBtn" type="button">Continue as Guest</button></div><div class="auth-error" id="error"></div></form><div class="auth-note">Your role is assigned by E-LEAP. Signing in does not allow manual role switching.</div></main><script>(function(){const params=new URLSearchParams(location.search);const next=params.get('next')||'./';const form=document.getElementById('loginForm');const err=document.getElementById('error');document.getElementById('guestBtn').onclick=()=>location.href=next;form.onsubmit=async(e)=>{e.preventDefault();err.textContent='';const btn=form.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Signing in…';try{const r=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Sign in failed');location.replace(next);}catch(ex){err.textContent=ex.message||'Sign in failed';btn.disabled=false;btn.textContent='Sign in';}}})();</script></body></html>
