<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP Research Report</title><link rel="stylesheet" href="assets/css/styles.css"><style>
body{margin:0;background:#f4f7f5;font-family:Poppins,system-ui,sans-serif;color:#173f38}.report-wrap{max-width:1180px;margin:0 auto;padding:28px}.report-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.report-actions{display:flex;gap:8px;flex-wrap:wrap}.report-actions button,.report-actions a{min-height:40px;border:1px solid #cfe0d8;border-radius:10px;background:#fff;color:#1d5b4c;font-weight:800;padding:0 14px;text-decoration:none;display:inline-flex;align-items:center}.report-actions .primary{background:#1d5b4c;color:#fff}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.filters label{display:grid;gap:5px;font-size:12px;font-weight:700}.filters input{min-height:38px;border:1px solid #cfe0d8;border-radius:9px;padding:0 10px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px;margin:18px 0}.metric{background:#fff;border:1px solid #e0ebe6;border-radius:14px;padding:16px}.metric b{font-size:26px;display:block}.metric span{color:#60756e;font-size:12px}.panel{background:#fff;border:1px solid #e0ebe6;border-radius:16px;padding:18px;margin-top:16px;overflow:auto}.panel h2{margin-top:0}.muted{color:#60756e}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px 8px;border-bottom:1px solid #edf2ef;text-align:left;white-space:nowrap}.table th{font-size:11px;text-transform:uppercase;color:#60756e}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#edf5f1;font-weight:800;font-size:11px}.empty{padding:20px;text-align:center;color:#60756e}.feedback-link{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.feedback-link input{min-width:360px;max-width:100%;flex:1;border:1px solid #cfe0d8;border-radius:8px;padding:8px}@media(max-width:800px){.metrics{grid-template-columns:1fr 1fr}.report-head{display:block}.report-actions{margin-top:12px}.report-wrap{padding:16px}}</style></head><body><main class="report-wrap"><div class="report-head"><div><div class="muted">E-LEAP / Classes / Research Report</div><h1 id="title">Research Report</h1><div id="sub" class="muted">Loading…</div></div><div class="report-actions"><a href="index.html" id="back">← Classes</a><button id="refresh">Refresh</button><button class="primary" id="xlsx">Export Excel</button></div></div><div class="filters"><label>From<input id="from" type="date"></label><label>To<input id="to" type="date"></label><label style="align-self:end"><button id="apply">Apply range</button></label></div><div id="metrics" class="metrics"></div><section class="panel"><h2>Session History</h2><div id="sessions"></div></section><section class="panel"><h2>Participation</h2><p class="muted">Research export uses pseudonymized participant IDs rather than student names.</p><div id="participation"></div></section><section class="panel"><h2>Attempts & Learning Outcomes</h2><div id="attempts"></div></section><section class="panel"><h2>Usability / Acceptance / Quality Feedback</h2><div id="feedback"></div></section></main><script>
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const q=new URLSearchParams(location.search);const classId=q.get('classId');let report=null;
function url(format){const p=new URLSearchParams({classId});if($('#from').value)p.set('from',$('#from').value+'T00:00:00Z');if($('#to').value)p.set('to',$('#to').value+'T23:59:59Z');if(format)p.set('format',format);return '/api/research/report?'+p.toString()}
async function load(){if(!classId){$('#sub').textContent='Missing classId';return}try{await fetch('/api/research/bootstrap',{method:'POST',credentials:'same-origin'});const r=await fetch(url(),{credentials:'same-origin',cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load report');report=d;render()}catch(e){$('#sub').textContent=e.message}}
function n(v){return v==null?'—':typeof v==='number'?Math.round(v*100)/100:v}
function render(){const d=report;$('#title').textContent=d.class?.class_name||'Research Report';$('#sub').textContent=[d.class?.course_id,d.class?.academic_year].filter(Boolean).join(' · ');const s=d.summary||{};$('#metrics').innerHTML=[['Sessions',s.sessions],['Participants',s.participants],['Active',s.active],['Submitted',s.submitted],['Not submitted',s.notSubmitted],['Total submits',s.totalSubmits],['Average score',n(s.averageScore)]].map(([a,b])=>`<div class="metric"><b>${esc(n(b))}</b><span>${esc(a)}</span></div>`).join('');$('#sessions').innerHTML=table(d.sessions,['sessionId','lessonId','status','startedAt','endedAt'],true);$('#participation').innerHTML=table(d.participation,['researchParticipantId','sessionsJoined','activeSessions','submittedSessions','status','activityViews','drafts','checks','totalSubmits','mediaEvents','latestScore','bestScore','averageScore']);$('#attempts').innerHTML=table(d.attempts,['researchParticipantId','sessionId','lessonId','activityId','attemptNo','submittedAt','score','correctCount','totalCount','answeredCount','unansweredCount']);$('#feedback').innerHTML=feedbackBlock(d.feedback||[])}
function table(rows,keys,sessionLinks=false){if(!rows?.length)return '<div class="empty">No data in this range.</div>';return `<table class="table"><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}${sessionLinks?'<th>Feedback</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td>${k==='status'?`<span class="pill">${esc(r[k])}</span>`:esc(n(r[k]))}</td>`).join('')}${sessionLinks?`<td><a href="research-feedback.html?classId=${encodeURIComponent(classId)}&sessionId=${encodeURIComponent(r.sessionId)}&lessonId=${encodeURIComponent(r.lessonId||'')}">Open form</a></td>`:''}</tr>`).join('')}</tbody></table>`}
function feedbackBlock(rows){if(!rows.length)return '<div class="empty">No consented research feedback yet.</div>';const keys=['researchParticipantId','respondentRole','dimension','instrument','sessionId','lessonId','createdAt','comment'];return table(rows,keys)}
$('#refresh').onclick=load;$('#apply').onclick=load;$('#xlsx').onclick=()=>{location.href=url('xlsx')};load();
</script></body></html>
