<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP · Sign in</title><style>
:root{--g:#1f4d3a;--bg:#f2f7f4;--line:#d7e4dc;--muted:#60756e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:#173f38;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 18px 50px rgba(25,70,55,.08)}h1{margin:0 0 8px}.muted{color:var(--muted)}label{display:grid;gap:7px;font-weight:800;margin-top:16px}input{min-height:48px;border:1px solid #cbdad2;border-radius:11px;padding:0 13px;font:inherit}button{margin-top:20px;width:100%;min-height:48px;border:0;border-radius:11px;background:var(--g);color:#fff;font-weight:900;font-size:16px;cursor:pointer}.status{min-height:24px;margin-top:12px;color:#8a2f2f;font-weight:700}.brand{font-weight:900;color:var(--g);letter-spacing:.04em}</style></head><body><main class="card"><div class="brand">E-LEAP</div><h1>Teacher / Admin sign in</h1><p class="muted">Use your E-LEAP account. Student access continues through the class join flow with a valid Student ID.</p><form id="f"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="10" required></label><button>Sign in</button><div class="status" id="status"></div></form></main><script type="module">import{Auth}from'./assets/js/auth-client.js';const p=new URLSearchParams(location.search),rawNext=p.get('next')||'/index.html',next=(rawNext.startsWith('/')&&!rawNext.startsWith('//'))?rawNext:'/index.html',f=document.querySelector('#f'),s=document.querySelector('#status');try{const me=await Auth.me();if(['teacher','admin'].includes(me.user.role))location.replace(next);}catch{}f.onsubmit=async e=>{e.preventDefault();s.textContent='Signing in…';try{const d=await Auth.login(document.querySelector('#email').value,document.querySelector('#password').value);if(!['teacher','admin'].includes(d.user.role))throw new Error('Teacher or Admin account required');location.replace(next);}catch(err){s.textContent=err.message||'Sign in failed';}};</script></body></html>
