<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP Mock Tests</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/styles.css"><style>body{background:#f2f7f5;font-family:Poppins,sans-serif;color:#173f35}.wrap{max-width:1050px;margin:0 auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.panel{background:#fff;border:1px solid #d7e6e1;border-radius:16px;padding:22px;margin-bottom:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.q{padding:14px;border:1px solid #dfe9e6;border-radius:12px;margin:10px 0}.q label{display:block;margin:7px 0}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #9bbdb4;background:#fff;color:#174f42;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer}.btn.primary{background:#145b49;color:#fff;border-color:#145b49}.status{padding:10px 12px;border-radius:10px;background:#edf7f4;margin-top:12px}.attempt{padding:12px 0;border-top:1px solid #e3ece9}.field{display:block;margin:12px 0}.field textarea,.field input{width:100%;box-sizing:border-box;border:1px solid #bdd2cc;border-radius:9px;padding:10px;font:inherit}.scorebox{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#f5faf8;border-radius:12px;padding:14px}.metric b{font-size:24px;display:block}@media(max-width:760px){.grid2,.scorebox{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><div class="wrap"><div class="head"><div><div style="font-size:13px;font-weight:700;color:#5c7c73">E-LEAP / Open Mock Test Library</div><h1 style="margin:4px 0">GOLDEN QA Mock Test</h1></div><a class="btn" href="index.html">← Back to platform</a></div><div id="app"><div class="panel">Loading…</div></div></div><script>
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,opt={}){const r=await fetch('/api/research'+path,{credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`Request failed (${r.status})`);return d}
async function me(){const r=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'});if(!r.ok){location.replace('signin.html?next='+encodeURIComponent('mock-tests.html'));return null}return (await r.json()).user}
function choice(name,text,disabled=false){return `<label><input type="radio" name="${name}" value="${text[0]}" ${disabled?'disabled':''}> ${esc(text)}</label>`}
function isAdminStudentPreview(user){let v='';try{v=localStorage.getItem('e-leap-admin-view-role')||''}catch{}return user?.role==='admin'&&v==='student'}
async function renderStudent(user,{preview=false}={}){let d={attempts:[]};if(!preview)d=await api('/mock-tests');const attempts=d.attempts||[];app.innerHTML=`${preview?'<div class="panel"><b>Administrator · Student preview</b><p>This is a read-only preview. Use TEST001 to submit a real mock attempt and test Score / Marking / Progress.</p></div>':''}<div class="panel"><b>Open Practice Mock</b><p>This QA mock verifies the complete E-LEAP assessment pipeline. Reading and Listening are auto-scored; Writing and Speaking are sent to Teacher/Admin marking.</p></div><form id="testForm"><div class="grid2"><section class="panel"><h2>Reading · auto-score</h2><div class="q"><b>1. Choose the best synonym of “rapid”.</b>${choice('r1','A. weak',preview)}${choice('r1','B. fast',preview)}${choice('r1','C. late',preview)}</div><div class="q"><b>2. Which sentence is grammatically correct?</b>${choice('r2','A. She go every day.',preview)}${choice('r2','B. She going every day.',preview)}${choice('r2','C. She goes every day.',preview)}</div></section><section class="panel"><h2>Listening · auto-score</h2><p style="color:#668178">QA transcript is used here so the scoring path can be verified without external audio dependency.</p><div class="q"><b>Transcript:</b> “The meeting starts at nine.”<br><b>1. When does it start?</b>${choice('l1','A. At nine',preview)}${choice('l1','B. At ten',preview)}${choice('l1','C. At noon',preview)}</div><div class="q"><b>Transcript:</b> “Mai chose the blue folder.”<br><b>2. Which folder?</b>${choice('l2','A. Red',preview)}${choice('l2','B. Blue',preview)}${choice('l2','C. Green',preview)}</div></section></div><section class="panel"><h2>Writing · teacher marking</h2><label class="field">Write 80–120 words about one way technology can improve learning.<textarea id="writing" rows="7" required ${preview?'readonly':''}></textarea></label></section><section class="panel"><h2>Speaking · teacher marking</h2><p>For this QA gate, enter the spoken response or transcript. The submission is routed through the same manual-marking state as Speaking.</p><label class="field">Speaking response / transcript<textarea id="speaking" rows="5" required ${preview?'readonly':''}></textarea></label></section><div class="panel">${preview?'<div class="status">Read-only preview: real submission is disabled for Admin preview.</div>':'<button class="btn primary" type="submit">Submit QA Mock</button><div id="submitStatus"></div>'}</div></form>${preview?'':`<section class="panel"><h2>My mock attempts</h2><div id="attempts">${attempts.map(a=>attemptRow(a)).join('')||'<p>No attempts yet.</p>'}</div></section>`}`;
 if(!preview)document.getElementById('testForm').onsubmit=async e=>{e.preventDefault();const ans={};for(const n of ['r1','r2','l1','l2'])ans[n]=document.querySelector(`input[name="${n}"]:checked`)?.value||'';if(Object.values(ans).some(v=>!v)){document.getElementById('submitStatus').innerHTML='<div class="status">Answer all Reading/Listening questions first.</div>';return}const payload={mockId:'golden-qa-mock-001',answers:ans,writingResponse:document.getElementById('writing').value,speakingResponse:document.getElementById('speaking').value};try{const out=await api('/mock-tests',{method:'POST',body:JSON.stringify(payload)});document.getElementById('submitStatus').innerHTML=`<div class="status"><b>Submitted.</b> Auto-score: ${out.autoScore}/${out.autoMax}. Writing/Speaking are waiting for marking.</div>`;setTimeout(()=>renderStudent(user),700)}catch(err){document.getElementById('submitStatus').innerHTML=`<div class="status">${esc(err.message)}</div>`}};
}
function attemptRow(a){const manual=(a.writing_score!=null&&a.speaking_score!=null)?Number(a.writing_score)+Number(a.speaking_score):null;const total=manual==null?null:Number(a.auto_score)+manual;const max=Number(a.auto_max||0)+Number(a.manual_max||0);return `<div class="attempt"><b>${esc(a.mock_id)}</b><div>Auto: ${a.auto_score}/${a.auto_max} · Status: ${esc(a.status)}</div>${total!=null?`<div><b>Total: ${total}/${max}</b></div>`:''}${a.feedback?`<div>Feedback: ${esc(a.feedback)}</div>`:''}</div>`}
async function renderStaff(user){const d=await api('/mock-tests');const rows=d.attempts||[];app.innerHTML=`<div class="panel"><b>${esc(user.role.toUpperCase())} Marking View</b><p>Reading/Listening auto-scores are already calculated. Mark Writing and Speaking, then release feedback.</p></div>${rows.map(a=>`<section class="panel" data-attempt="${a.attempt_id}"><h3>${esc(a.student_name||a.student_code)} · ${esc(a.mock_id)}</h3><div class="scorebox"><div class="metric"><span>Auto</span><b>${a.auto_score}/${a.auto_max}</b></div><div class="metric"><span>Status</span><b style="font-size:16px">${esc(a.status)}</b></div><div class="metric"><span>Submitted</span><b style="font-size:14px">${new Date(a.submitted_at).toLocaleString()}</b></div></div><label class="field"><b>Writing response</b><textarea rows="5" readonly>${esc(a.writing_response||'')}</textarea></label><label class="field"><b>Speaking response / transcript</b><textarea rows="4" readonly>${esc(a.speaking_response||'')}</textarea></label><div class="grid2"><label class="field">Writing score /10<input type="number" min="0" max="10" step="0.5" data-w value="${a.writing_score??''}"></label><label class="field">Speaking score /10<input type="number" min="0" max="10" step="0.5" data-s value="${a.speaking_score??''}"></label></div><label class="field">Feedback<textarea rows="4" data-f>${esc(a.feedback||'')}</textarea></label><label><input type="checkbox" data-release ${a.status==='feedback-released'?'checked':''}> Release to student</label><div style="margin-top:12px"><button class="btn primary" data-save>Save marking</button> <span data-status></span></div></section>`).join('')||'<div class="panel">No mock attempts available for your classes yet.</div>';
 document.querySelectorAll('[data-attempt]').forEach(card=>card.querySelector('[data-save]').onclick=async()=>{const payload={attemptId:card.dataset.attempt,writingScore:card.querySelector('[data-w]').value,speakingScore:card.querySelector('[data-s]').value,feedback:card.querySelector('[data-f]').value,releaseFeedback:card.querySelector('[data-release]').checked};try{await api('/mock-tests',{method:'PATCH',body:JSON.stringify(payload)});card.querySelector('[data-status]').textContent='Saved';setTimeout(()=>renderStaff(user),500)}catch(err){card.querySelector('[data-status]').textContent=err.message}});
}
(async()=>{const user=await me();if(!user)return;if(user.role==='student')renderStudent(user);else if(isAdminStudentPreview(user))renderStudent(user,{preview:true});else if(['teacher','admin'].includes(user.role))renderStaff(user);else app.innerHTML='<div class="panel">Sign in as Student, Teacher, or Admin to use Mock Tests.</div>'})().catch(e=>app.innerHTML=`<div class="panel">${esc(e.message)}</div>`);
</script></body></html>
