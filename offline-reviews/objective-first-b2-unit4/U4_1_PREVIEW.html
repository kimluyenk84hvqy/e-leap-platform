<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP U4.1 · OFFLINE REVIEW</title><style>*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f1f8f3;color:#10382a;font-size:22px}button,select,input,textarea{font:inherit}button{cursor:pointer}header{display:flex;align-items:center;gap:12px;background:#063a2e;color:white;padding:12px 22px;min-height:70px}header b{font-size:26px;color:#c7fa88}header small{flex:1;font-size:17px;color:#d5e6d8}.btn{border:0;border-radius:10px;padding:10px 14px;background:#0e6248;color:white;font-size:17px;font-weight:800}.btn.lime{background:#c0f078;color:#073e2f}.btn.pale{background:#e0efdf;color:#064b39}.btn:hover{filter:brightness(1.1)}.page{max-width:1480px;margin:auto;padding:22px 30px 90px}.over{font-size:16px;font-weight:900;letter-spacing:1.5px;color:#368668;text-transform:uppercase}h1{font-size:clamp(40px,4vw,63px);letter-spacing:-1px;line-height:1.09;margin:8px 0 22px}h2{font-size:27px;margin:0 0 12px}.block{border:1px solid #d5e6da;border-radius:18px;background:white;padding:22px;box-shadow:0 7px 18px #0b503315}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px}.note{border-left:7px solid #a6e171;background:#eff9e7;padding:14px 18px;border-radius:12px;margin:12px 0}.prompt{font-size:24px;font-weight:700;background:#f4faf5;padding:16px;border-radius:12px;margin-bottom:12px}.aim{font-size:23px;border-left:7px solid #9cdb69}.aim strong{display:block;color:#11684a;font-size:17px;margin-bottom:9px}.aim p{margin:0}.cover{height:calc(100vh - 220px);min-height:480px;border-radius:28px;background:radial-gradient(circle at 80% 25%,#5ab274 0,transparent 32%),linear-gradient(120deg,#042f27,#0b694a);color:white;padding:6vw;display:flex;flex-direction:column;justify-content:center}.cover h1{font-size:clamp(70px,9vw,125px);letter-spacing:-4px;color:#d3fa92}.cover p{font-size:36px;color:#e4fae7}.cover .over{color:#c6efaf}.question{padding:12px;border-bottom:1px solid #dcebe0}.question .q{font-size:22px;font-weight:700;margin-bottom:9px}.row{display:flex;align-items:center;flex-wrap:wrap;gap:9px}.row input,.row select{border:2px solid #bcd6c5;border-radius:9px;padding:9px;font-size:19px;min-width:115px;max-width:240px}.feedback{font-size:17px;font-weight:800}.good{color:#197947}.bad{color:#b23939}.why{background:#eff9df;padding:10px 12px;border-radius:10px;margin:9px 0;font-size:18px}.step{display:flex;gap:15px;border-bottom:1px solid #e6f0e9;padding:15px 0;font-size:24px;font-weight:650}.step:before{content:"✓";color:#0a744b;font-weight:900}.pane{border:1px solid #cce2d0;background:white;border-radius:17px;padding:17px;min-width:0}.scroll{height:460px;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.tab{background:#eef4e9;border:1px solid #c9dfce;border-radius:9px;padding:7px 12px;font-size:18px;font-weight:800}.tab.on{background:#0d6048;color:white}.story{font-size:24px;line-height:1.62}.story mark{background:#fff389;border-radius:3px;padding:2px}.notebox{width:100%;min-height:100px;border:2px solid #c0d6c4;border-radius:11px;padding:12px;resize:vertical}.label{font-size:18px;color:#0a674b;font-weight:900;margin:10px 0 5px}.model{font-size:26px;line-height:1.65}footer{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;align-items:center;gap:15px;padding:12px 26px;border-top:1px solid #d4e5d8;box-shadow:0 -8px 24px #0c462315}.bar{height:9px;flex:1;background:#e9f1e9;border-radius:50px;overflow:hidden}.bar i{display:block;height:100%;background:#249460}.thanks{text-align:center;padding-top:10vh}.thanks h1{color:#07543e;font-size:clamp(48px,6vw,90px)}.thanks p{color:#5b8069;font-size:30px}.small{color:#527667;font-size:17px}@media(max-width:870px){.grid,.three{grid-template-columns:1fr}header{flex-wrap:wrap}header small{display:none}.scroll{height:300px}.page{padding:16px 12px 88px}.cover{padding:25px}.cover h1{font-size:55px}footer{padding:9px}footer .btn{font-size:15px}}</style></head><body><div id="app"></div><script id="source" type="application/json">{"unit":"U4.1","s":[{"t":"Cover","h":"ENDANGERED","s":"Wildlife • Habitats • Conservation","k":"cover"},{"t":"Bloom Aims","h":"Today's Learning Outcomes","k":"aims","p":[["KNOWLEDGE","Identify threats to endangered species and use wildlife vocabulary and word families accurately."],["SKILLS","Summarise short reading texts, exchange key information, justify answers with textual evidence, evaluate zoos and create a conservation proposal."],["ATTITUDES","Demonstrate responsibility for wildlife through informed, respectful collaboration."]]},{"t":"Pair Talk","h":"Which Animals Need Our Help?","k":"talk","q":["Which wild animal is most at risk? Explain.","How might human activity threaten its habitat?","Can a zoo help an endangered species?"]},{"t":"Habitat Match","h":"Where Do They Live?","k":"quiz","q":[["A polar bear lives mainly in the _____.","Arctic","It depends on sea ice."],["An orangutan lives mainly in the _____.","rainforest","Orangutans live in tropical forests."],["A dolphin lives in the _____.","ocean","Dolphins are marine mammals."],["A camel is adapted to the _____.","desert","Camels tolerate hot and dry conditions."],["A lion often lives in open _____.","grassland","Many lions inhabit savannas and grasslands."]]},{"t":"Think-Pair-Share","h":"Threat → Effect → Solution","k":"talk","q":["How does deforestation affect orangutans?","Why is melting sea ice dangerous for polar bears?","How can plastic pollution affect sea animals?","Propose one action for each threat."]},{"t":"Group Work","h":"One Threat, Four Perspectives","k":"group","q":["Member 1: Explain the cause","Member 2: Describe the effect","Member 3: Provide evidence or an example","Member 4: Recommend a practical solution"]},{"t":"Reading Strategy","h":"Become a Reading Expert","k":"steps","q":["Divide into expert groups A–E.","Read YOUR passage and find its main idea, two supporting details and the writer's opinion.","Summarise in 2–3 sentences without copying.","Teach your home group; listen, ask questions and take notes.","Use the shared information to complete the book task."]},{"t":"Jigsaw Reading","h":"Read, Summarise, Teach","k":"reading","mode":"expert"},{"t":"Group Sharing","h":"Rebuild the Whole Story","k":"group","q":["Text A: main idea and evidence","Text B: main idea and evidence","Text C: main idea and evidence","Text D: main idea and evidence","Text E: main idea and evidence"]},{"t":"Reading Questions","h":"Find the Evidence","k":"reading","mode":"questions"},{"t":"Group Debate","h":"Do Zoos Protect Wildlife?","k":"talk","q":["Give two reasons in favour of your group's view.","Present a counterargument fairly.","Support your conclusion with a detail from TWO different texts."]},{"t":"Word Formation","h":"Build the Correct Word","k":"quiz","q":[["The species is in serious _____. (DANGER)","danger","The phrase needs a noun."],["Wildlife _____ is essential. (CONSERVE)","conservation","Noun from conserve."],["The programme is highly _____. (EDUCATE)","educational","Adjective describing programme."],["Animals are _____ by pollution. (THREAT)","threatened","Passive participle."],["Survival requires international _____. (COOPERATE)","cooperation","Uncountable noun."],["The centre provides useful _____. (INFORM)","information","Noun meaning facts."],["A good keeper acts _____. (RESPONSIBLE)","responsibly","Adverb modifies acts."]]},{"t":"Group Proposal","h":"Design a Conservation Action","k":"group","q":["Name your animal and habitat.","Identify two threats.","Suggest two realistic actions.","Explain the likely impact. Each member speaks."]},{"t":"Thank You","h":"PROTECT WHAT MATTERS","s":"Thank you • Every action counts","k":"thanks"}],"p":[["A","Lara","I visited the zoo with my cousin, who had never seen a giant tortoise. We followed a quiet trail and read the information boards. A keeper explained how visitors could reduce waste at home. I was glad the entrance fee helped support an endangered-animal programme."],["B","Mia","Before our school visit, I thought every zoo was just a place to look at animals. A keeper explained how carefully managed breeding programmes might help rare species. The explanation changed my opinion, although I still believe animal welfare must come first."],["C","Noah","I enjoyed the zoo but had mixed feelings about animal enclosures. Some spaces looked too small for animals that travel long distances. In another area I noticed enrichment activities encouraging natural behaviour. The contrast made me think more critically about welfare."],["D","Tom","I expected an expensive day out, but there was enough to do for the price. The interactive learning centre helped us compare habitats, and we stayed there much longer than planned. My younger brother especially enjoyed the hands-on displays."],["E","Sana","I volunteer in an environmental club, so I was interested in projects beyond the zoo gates. Staff described how local groups restore damaged habitats and work with schools. I signed up for a weekend clean-up because I wanted to take action."]],"r":[["Who visited with a relative?","A","with my cousin","Cousin is a family member."],["Who learned how visitors can reduce waste?","A","reduce waste at home","The keeper suggests action at home."],["Who changed their view after expert explanation?","B","changed my opinion","The opinion changed."],["Who considers animal welfare essential?","B","animal welfare must come first","Welfare was prioritised."],["Who worried about enclosure size?","C","Some spaces looked too small","The issue is space."],["Who noticed enrichment for natural behaviour?","C","enrichment activities encouraging natural behaviour","Enrichment was observed."],["Who believed tickets offered good value?","D","enough to do for the price","This evaluates value for money."],["Who stayed longer at an interactive centre?","D","much longer than planned","The writer stayed longer."],["Who cared about projects beyond the zoo?","E","projects beyond the zoo gates","Those projects occur outside zoo grounds."],["Who volunteered after the visit?","E","signed up for a weekend clean-up","Signing up is a volunteering action."]]}</script><script>(function(){
const d=JSON.parse(document.getElementById("source").textContent);
const slides=d.s,root=document.getElementById("app");let i=0,tab="A",highlight=null,reveal=false,timer=null,left=300;
const answers={},notes={},shown={},checks={};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function b(text,id,cl){return '<button type="button" class="btn '+(cl||"")+'" data-action="'+id+'">'+text+'</button>'}
function header(){return '<header><b>E-LEAP</b><small>OBJECTIVE FIRST B2 · '+d.unit+' · OFFLINE TEACHER REVIEW</small>'+b("Check","check","pale")+b("Reset","reset","pale")+b(reveal?"Hide Answer":"Show Answer","reveal","lime")+b(timer?"⏱ "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0"):"Timer 5:00","timer","pale")+'</header>'}
function bottom(){return '<footer>'+b("← Previous","prev","pale")+'<span class="small">'+(i+1)+' / '+slides.length+'</span><div class="bar"><i style="width:'+((i+1)/slides.length*100)+'%"></i></div>'+b("Next →","next","")+'</footer>'}
function top(s){return '<div class="over">'+esc(s.t)+' · '+esc(d.unit)+'</div><h1>'+esc(s.h)+'</h1>'}
function note(key){return '<textarea class="notebox" data-note="'+key+'" placeholder="Type your key ideas…">'+esc(notes[i+"-"+key]||"")+'</textarea>'}
function quiz(s){return '<div class="block">'+s.q.map((x,n)=>'<div class="question"><div class="q">'+(n+1)+'. '+esc(x[0])+'</div><div class="row"><input data-q="'+n+'" value="'+esc(answers[i+"-"+n]||"")+'" placeholder="Your answer">'+b("Check","one-"+n,"pale")+'<span class="feedback" id="check'+n+'">'+(checks[i+"-"+n]||"")+'</span>'+(reveal?'<b class="good">✓ '+esc(x[1])+'</b>':"")+b("WHY?","why-"+n,"pale")+'</div>'+(shown[n]?'<div class="why">'+esc(x[2])+'</div>':"")+'</div>').join("")+'<div id="score" class="note">Unanswered questions count in the score.</div></div>'}
function read(s){let p=d.p.find(x=>x[0]===tab)||d.p[0],v=esc(p[2]);if(highlight&&highlight.a===p[0]){const z=esc(highlight.e);v=v.replace(z,'<mark>'+z+'</mark>')}let right="";
if(s.mode==="expert"){right='<div class="prompt">1. Identify the main idea.</div><div class="prompt">2. Find two key details.</div><div class="prompt">3. Explain the writer’s opinion.</div><div class="prompt">4. Summarise in 2–3 sentences.</div>'+note("summary-"+tab)}else{right='<p class="small">Answer A–E. Select Evidence to highlight the exact words in the text.</p>'+d.r.map((x,n)=>'<div class="question"><div class="q">'+(n+1)+'. '+esc(x[0])+'</div><div class="row"><select data-q="'+n+'"><option value="">Choose</option>'+d.p.map(z=>'<option value="'+z[0]+'" '+(answers[i+"-"+n]===z[0]?"selected":"")+'>'+z[0]+'</option>').join("")+'</select>'+b("Check","one-"+n,"pale")+b("Evidence","ev-"+n,"pale")+b("WHY?","why-"+n,"pale")+'<span class="feedback" id="check'+n+'">'+(checks[i+"-"+n]||"")+'</span>'+(reveal?'<b class="good">'+x[1]+'</b>':"")+'</div>'+(shown[n]?'<div class="why">'+esc(x[3])+'</div>':"")+'</div>').join("")+'<div id="score" class="note">Then complete the corresponding reading task in your Student’s Book.</div>'}
return '<div class="grid"><div class="pane"><h2>READING · LEFT SCROLL</h2><div class="tabs">'+d.p.map(x=>'<button class="tab '+(tab===x[0]?"on":"")+'" data-tab="'+x[0]+'">Text '+x[0]+'</button>').join("")+'</div><div id="textScroll" class="scroll story"><div class="label">TEXT '+p[0]+' · '+esc(p[1])+'</div>'+v+'</div></div><div class="pane"><h2>GROUP TASK · RIGHT SCROLL</h2><div class="scroll">'+right+'</div></div></div>'}
function show(s){if(s.k==="cover")return '<div class="cover"><div class="over">OBJECTIVE FIRST B2 · '+d.unit+'</div><h1>'+esc(s.h)+'</h1><p>'+esc(s.s)+'</p></div>';
if(s.k==="thanks")return '<div class="thanks"><h1>'+esc(s.h)+'</h1><p>'+esc(s.s)+'</p></div>';
let a=top(s);
if(s.k==="aims")return a+'<div class="three">'+s.p.map(x=>'<div class="block aim"><strong>'+esc(x[0])+'</strong><p>'+esc(x[1])+'</p></div>').join("")+'</div><div class="note">BLOOM: IDENTIFY → APPLY → SUMMARISE → ANALYSE → EVALUATE → CREATE</div>';
if(s.k==="read"||s.k==="reading")return a+read(s);
if(s.k==="quiz")return a+quiz(s);
if(s.k==="model")return a+'<div class="block model">'+s.p.map(x=>'<p>'+esc(x)+'</p>').join("")+'</div>';
if(s.k==="steps")return a+'<div class="grid"><div class="block">'+s.q.map(x=>'<div class="step">'+esc(x)+'</div>').join("")+'</div><div class="block"><h2>Success criteria</h2><div class="prompt">Every learner reads, summarises and explains a text.</div><div class="prompt">The group completes the book task using shared evidence.</div></div></div>';
if(s.k==="group")return a+'<div class="grid"><div class="block">'+s.q.map((x,n)=>'<div class="label">'+esc(x)+'</div>'+note("g"+n)).join("")+'</div><div class="block"><h2>Share your result</h2><div class="prompt">Every member contributes.</div><div class="prompt">Prepare one 60-second group report.</div></div></div>';
if(s.k==="talk")return a+'<div class="grid"><div class="block">'+s.q.map((x,n)=>'<div class="prompt">'+(n+1)+'. '+esc(x)+'</div>').join("")+'</div><div class="block"><h2>Think → Pair → Share</h2><p>Take turns. Ask for reasons and examples.</p>'+note("pair")+'</div></div>';
return a}
function draw(){root.innerHTML=header()+'<main class="page">'+show(slides[i])+'</main>'+bottom()}
function item(n){const s=slides[i],q=s.k==="reading"&&s.mode==="questions"?d.r:s.q;if(!Array.isArray(q)||!Array.isArray(q[n]))return;const ans=String(answers[i+"-"+n]||"").trim().toLowerCase(),ok=ans===String(q[n][1]).trim().toLowerCase();checks[i+"-"+n]=!ans?"Not answered":ok?"✓ Correct":"✕ Try again";const el=document.getElementById("check"+n);if(el){el.textContent=checks[i+"-"+n];el.className="feedback "+(ok?"good":"bad")}}
function checkAll(){const s=slides[i],q=s.k==="reading"&&s.mode==="questions"?d.r:s.q;if(!Array.isArray(q)||s.k!=="quiz"&&s.mode!=="questions")return;q.forEach((x,n)=>item(n));let right=q.reduce((a,x,n)=>a+(String(answers[i+"-"+n]||"").trim().toLowerCase()===String(x[1]).toLowerCase()?1:0),0);const e=document.getElementById("score");if(e)e.textContent="Score: "+right+" / "+q.length+" ("+Math.round(right*100/q.length)+"%). Unanswered included."}
root.addEventListener("input",e=>{const x=e.target;if(x.dataset.q!==undefined)answers[i+"-"+x.dataset.q]=x.value;if(x.dataset.note!==undefined)notes[i+"-"+x.dataset.note]=x.value});
root.addEventListener("change",e=>{if(e.target.dataset.q!==undefined)answers[i+"-"+e.target.dataset.q]=e.target.value});
root.addEventListener("click",e=>{const tabBtn=e.target.closest("[data-tab]");if(tabBtn){tab=tabBtn.dataset.tab;highlight=null;draw();return}const btn=e.target.closest("[data-action]");if(!btn)return;const action=btn.dataset.action;
if(action==="prev"||action==="next"){i=Math.max(0,Math.min(slides.length-1,i+(action==="next"?1:-1)));reveal=false;shown={};highlight=null;draw();return}
if(action==="reset"){Object.keys(answers).filter(k=>k.startsWith(i+"-")).forEach(k=>delete answers[k]);Object.keys(notes).filter(k=>k.startsWith(i+"-")).forEach(k=>delete notes[k]);shown={};highlight=null;reveal=false;draw();return}
if(action==="reveal"){reveal=!reveal;draw();return}
if(action==="check"){checkAll();return}
if(action==="timer"){if(timer){clearInterval(timer);timer=null;left=300;draw();return}timer=setInterval(()=>{left--;const el=root.querySelector('[data-action="timer"]');if(el)el.textContent="⏱ "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0");if(left<=0){clearInterval(timer);timer=null;left=300;alert("Time is up.");draw()}},1000);draw();return}
if(action.startsWith("one-")){item(Number(action.slice(4)));return}
if(action.startsWith("why-")){const n=Number(action.slice(4));shown[n]=!shown[n];draw();return}
if(action.startsWith("ev-")){const n=Number(action.slice(3)),x=d.r[n];tab=x[1];highlight={a:x[1],e:x[2]};draw();setTimeout(()=>{const pane=document.getElementById("textScroll"),mark=pane&&pane.querySelector("mark");if(mark)pane.scrollTop=mark.offsetTop-pane.offsetTop-50},40);return}
});
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement?.tagName))return;if(e.key==="ArrowRight"&&i<slides.length-1){i++;draw()}if(e.key==="ArrowLeft"&&i>0){i--;draw()}});
draw()})();</script></body></html>
