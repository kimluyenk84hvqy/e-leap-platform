<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP · Account security</title><link rel="stylesheet" href="assets/css/styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#f2f7f4;padding:24px}.card{width:min(500px,100%);background:#fff;border:1px solid #d3e2d9;border-radius:18px;padding:28px;box-shadow:0 18px 50px #173f3114}.brand{font-size:26px;font-weight:800;color:#1f4d3a}.muted{color:#60766d;line-height:1.5}.field{display:grid;gap:6px;margin:14px 0;font-weight:700}.field input{padding:12px 13px;border:1px solid #cbdad1;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:11px 16px;background:#1f4d3a;color:#fff;font-weight:800;cursor:pointer}.link{display:inline-block;margin-left:10px;color:#1f4d3a;font-weight:800;text-decoration:none}.err{min-height:20px;color:#9a3131;font-size:12px;margin-top:12px}.ok{min-height:20px;color:#176b44;font-size:12px;margin-top:12px}</style></head><body><main class="card"><div class="brand">E-LEAP</div><h1 id="title">Account security</h1><p class="muted" id="intro">Change your sign-in secret securely.</p><form id="f"><label class="field"><span id="currentLabel">Current password</span><input id="current" type="password" autocomplete="current-password" required></label><label class="field"><span id="nextLabel">New password</span><input id="next" type="password" autocomplete="new-password" required></label><label class="field"><span id="confirmLabel">Confirm new password</span><input id="confirm" type="password" autocomplete="new-password" required></label><button class="btn" type="submit">Save & sign in again</button><a class="link" href="./">Cancel</a><div class="err" id="err"></div><div class="ok" id="ok"></div></form></main><script>(async function(){const me=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);if(!me?.user)return location.replace('signin.html');const user=me.user,isStudent=user.role==='student',forced=Boolean(user.must_change_password&&user.role==='teacher');const title=document.getElementById('title'),intro=document.getElementById('intro'),currentLabel=document.getElementById('currentLabel'),nextLabel=document.getElementById('nextLabel'),confirmLabel=document.getElementById('confirmLabel'),next=document.getElementById('next'),confirm=document.getElementById('confirm');if(isStudent){title.textContent='Change PIN';intro.textContent='Choose a new private 6-digit PIN. After saving, E-LEAP signs out all existing sessions for this account.';currentLabel.textContent='Current PIN';nextLabel.textContent='New 6-digit PIN';confirmLabel.textContent='Confirm new PIN';next.inputMode=confirm.inputMode='numeric';next.maxLength=confirm.maxLength=6;next.pattern=confirm.pattern='[0-9]{6}';}else{title.textContent=forced?'Create your password':'Change password';intro.textContent=forced?'For security, replace your temporary password before entering E-LEAP.':'Choose a new password of at least 10 characters. After saving, E-LEAP signs out all existing sessions for this account.';next.minLength=confirm.minLength=10;}const f=document.getElementById('f'),err=document.getElementById('err'),ok=document.getElementById('ok');f.onsubmit=async e=>{e.preventDefault();err.textContent='';ok.textContent='';const a=next.value,b=confirm.value;if(a!==b)return err.textContent=isStudent?'New PINs do not match.':'New passwords do not match.';if(isStudent&&!/^\d{6}$/.test(a))return err.textContent='PIN must contain exactly 6 digits.';const btn=f.querySelector('button');btn.disabled=true;btn.textContent='Saving…';try{const r=await fetch('/api/auth/change-password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword:document.getElementById('current').value,newPassword:a})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Change failed');ok.textContent='Saved. For security, all sessions were signed out.';setTimeout(()=>location.replace(`signin.html?role=${encodeURIComponent(user.role)}`),900);}catch(ex){err.textContent=ex.message||'Change failed';btn.disabled=false;btn.textContent='Save & sign in again';}}})();</script><script src="assets/js/session-timeout.js?v=golden-idle-90m-v1"></script></body></html>
