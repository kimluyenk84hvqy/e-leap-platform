<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E-LEAP · Change password</title><link rel="stylesheet" href="assets/css/styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#f2f7f4;padding:24px}.card{width:min(480px,100%);background:#fff;border:1px solid #d3e2d9;border-radius:18px;padding:28px;box-shadow:0 18px 50px #173f3114}.brand{font-size:26px;font-weight:800;color:#1f4d3a}.muted{color:#60766d}.field{display:grid;gap:6px;margin:14px 0;font-weight:700}.field input{padding:12px 13px;border:1px solid #cbdad1;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:11px 16px;background:#1f4d3a;color:#fff;font-weight:800;cursor:pointer}.err{min-height:20px;color:#9a3131;font-size:12px;margin-top:12px}</style></head><body><main class="card"><div class="brand">E-LEAP</div><h1>Create your password</h1><p class="muted">For security, your temporary Teacher password must be replaced before you enter the Teacher Workspace.</p><form id="f"><label class="field">Temporary password<input id="current" type="password" autocomplete="current-password" required></label><label class="field">New password<input id="next" type="password" autocomplete="new-password" minlength="10" required></label><label class="field">Confirm new password<input id="confirm" type="password" autocomplete="new-password" minlength="10" required></label><button class="btn" type="submit">Save password & continue</button><div class="err" id="err"></div></form></main><script>(async function(){const me=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);if(!me?.user)return location.replace('signin.html');if(!me.user.must_change_password)return location.replace('./');const f=document.getElementById('f'),err=document.getElementById('err');f.onsubmit=async e=>{e.preventDefault();err.textContent='';const a=document.getElementById('next').value,b=document.getElementById('confirm').value;if(a!==b)return err.textContent='New passwords do not match.';const btn=f.querySelector('button');btn.disabled=true;btn.textContent='Saving…';try{const r=await fetch('/api/auth/change-password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword:document.getElementById('current').value,newPassword:a})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Password change failed');location.replace('./');}catch(ex){err.textContent=ex.message;btn.disabled=false;btn.textContent='Save password & continue';}}})();</script></body></html>
